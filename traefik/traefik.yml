# Traefik Static Configuration
# Kolonie AI — Production
# NOTE: No ${VAR} interpolation here. Traefik doesn't support it in static YAML.
# Cloudflare credentials are set via environment in docker-compose.yml.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

# Let's Encrypt via Cloudflare DNS Challenge
# Env vars CF_API_TOKEN and CF_EMAIL are set in docker-compose.yml
certificatesResolvers:
  cloudflare:
    acme:
      email: admin@kolonie.ai
      storage: /certs/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10s

api:
  dashboard: false
  insecure: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: kolonie
    versionCheck: false
  file:
    directory: /dynamic
    watch: true

log:
  level: INFO

accessLog: {}
