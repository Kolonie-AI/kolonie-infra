name: CI

# The general slot. `kolonie-docs#124` measured that a pull request changing
# `traefik/dynamic/routes.yml` here ran **nothing** — `Rehearse` is path-filtered
# to `scripts/**` and `docker-compose.yml`, so a change to Traefik routing or to
# anything under `cloudflare/`, `systemd/` or `pgadmin/` was merged on a human's
# reading alone. `#124` calls this repository the sharpest of the three cases and
# it is: a wrong route takes the Colony's own domain off the network.
#
# ## Why the name is exactly `CI`
#
# `review-pull-request.yml` in `kolonie-docs` is called by
# `on: workflow_run: workflows: [CI]`. The name is the wiring that lets the
# Reviewer Agent attach here with a copy of the caller that already exists.
#
# ## Why a parse and a syntax check, and nothing cleverer
#
# `#124`: *"Both are things I have run by hand this session after every edit,
# which is the tell."* That is the whole justification and it is a good one. A
# YAML file that does not parse and a shell script that does not tokenise are the
# two ways a change here has actually broken, and both are checkable in seconds
# without a host, a secret or a deployment.
#
# **It is not a linter and it must not become one.** `bash -n` says the script
# parses; it says nothing about whether the deploy is correct, and `Rehearse`
# exists for that. Widening this into shellcheck-with-opinions would make it the
# thing that argues with contributors about quoting style, and `#124` is explicit
# that a check invented to look impressive is worse than the gap it fills.
#
# **A schema check on the Traefik files was considered and left out.** Traefik
# validates its own configuration at load and reports on the container's logs,
# `health-watch.yml` notices when that goes wrong, and a second-guessing schema
# in this repository would be a copy of Traefik's rules that goes stale the
# way every copied list in this project has gone stale. Parse-only is the honest
# claim: this file is YAML, and whether it is *good* YAML is Traefik's opinion.

on:
  push:
    branches: [main]
  # No path filter. That is the point of this workflow and an acceptance
  # criterion of kolonie-docs#124, not an oversight.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Every file is reported, passing or failing, and the count is printed at
      # the end. A check that finds nothing to check is the failure this
      # repository has already had once (#38, a rehearsal that had stopped
      # watching), so "0 files parsed" must not look like success.
      - name: Every YAML document parses
        run: |
          set -uo pipefail
          status=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            # safe_load_all, not safe_load: docker-compose.yml is one document
            # but a Traefik dynamic file may legitimately be several.
            if err=$(python3 -c '
          import sys, yaml
          list(yaml.safe_load_all(open(sys.argv[1], encoding="utf-8")))
          ' "$f" 2>&1); then
              echo "  ok   $f"
            else
              echo "::error file=$f::$(printf '%s' "$err" | tail -1)"
              echo "  FAIL $f"
              status=1
            fi
          done < <({ ls docker-compose.yml docker-compose.dev.yml
                     find traefik loki promtail -type f \( -name '*.yml' -o -name '*.yaml' \); } | sort -u)

          echo "$count YAML files parsed"
          # Four, against the eight that exist on 2026-08-04 — six until #68
          # added loki/loki.yml and promtail/promtail.yml, which are configuration
          # this repository ships and a container refuses to start on. The floor
          # is for a broken finder, not for a legitimately deleted Traefik file —
          # set at the count and it would go red the first time somebody removes one on
          # purpose, which teaches people to ignore it.
          if [ "$count" -lt 4 ]; then
            echo "::error::only $count YAML files were found — this repository has more, so the check is broken rather than the files"
            exit 1
          fi
          exit $status

      - name: Every shell script tokenises
        run: |
          set -uo pipefail
          status=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if err=$(bash -n "$f" 2>&1); then
              echo "  ok   $f"
            else
              echo "::error file=$f::$(printf '%s' "$err" | tail -1)"
              echo "  FAIL $f"
              status=1
            fi
          done < <(find scripts -name '*.sh' | sort)

          echo "$count shell scripts checked"
          if [ "$count" -lt 10 ]; then
            echo "::error::only $count scripts were found under scripts/ — the check is broken rather than the scripts"
            exit 1
          fi
          exit $status
