name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, api, verifier-runner, website)'
        required: false
        default: 'all'

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  DEPLOY_DIR: /opt/kolonie

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # packages: read lets GITHUB_TOKEN pull the application images from GHCR.
    # It only works once kolonie-infra has been granted read access to those
    # packages in their settings — see kolonie-infra#1. The alternative, making
    # the packages public, would publish the built source of kolonie-platform
    # before the repositories go public at MVP (kolonie-docs#6).
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          # Expires with this job. Nothing long-lived is stored on the host.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd ${{ env.DEPLOY_DIR }}

            # Pull latest infra config
            git pull origin main

            # Run deployment
            SERVICE="${{ github.event.inputs.service || 'all' }}"
            chmod +x scripts/*.sh
            ./scripts/deploy.sh "$SERVICE"

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_DIR }}
            ./scripts/healthcheck.sh

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment failed! Check VPS logs."
