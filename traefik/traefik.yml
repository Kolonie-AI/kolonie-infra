# Traefik Static Configuration
# Kolonie AI — Production

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  ping:
    address: ":8080"

# Let's Encrypt via Cloudflare DNS Challenge
# Token passed as CLOUDFLARE_DNS_API_TOKEN env var from docker-compose
certificatesResolvers:
  cloudflare:
    acme:
      email: admin@kolonie.ai
      storage: /certs/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10s

api:
  dashboard: false
  insecure: false

ping:
  entryPoint: ping

# Docker provider (Traefik v3.7 supports Docker API 1.40+)
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: kolonie
  file:
    directory: /dynamic
    watch: true

log:
  level: INFO

accessLog: {}
