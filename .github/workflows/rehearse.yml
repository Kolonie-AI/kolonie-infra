name: Rehearse

# The rehearsals stand in for a test suite that `deploy.sh` and `backup.sh`
# cannot otherwise have — both are scripts whose interesting branches only run
# when something has gone wrong in production. AGENTS.md §7 requires them green
# before a change is done.
#
# **This workflow exists because nothing ran them.** `rehearse-deploy.sh` was red
# on `main` for an unknown number of days and it took writing an unrelated second
# rehearsal to notice (#38). Five assertions had stopped watching the deploy
# after `detect_profile()` switched from `docker manifest inspect` to
# `docker pull -q` in f624063 — the deploy was correct throughout, but nothing
# would have said so if it had not been. A suite nobody runs is a suite that is
# red and does not know it.
#
# It deliberately does **not** gate `deploy.yml`. That workflow is reusable and
# `kolonie-platform` calls it after building an image; a rehearsal failure would
# then block a deploy from another repository over a stale assertion in this one.
# The signal is a red check on the commit, which is enough to be noticed and
# cannot take the Colony offline.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/rehearse.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/rehearse.yml'
  workflow_dispatch:

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Neither rehearsal needs Docker, a VPS, a registry or a credential: each
      # runs the real script against stubs on PATH and a scratch directory in
      # place of /opt/kolonie. That is the whole reason they can run here.
      - name: deploy.sh
        run: bash scripts/rehearse-deploy.sh

      - name: backup.sh
        run: bash scripts/rehearse-backup.sh

      # drift-triage.sh reaches GHCR in production; here it reaches a stub. The
      # judgement it makes — current, behind by a number, or unable to tell — is
      # the part worth testing, and collapsing `unknown` into either of the
      # others is how a watcher becomes noise (#44).
      - name: drift-triage.sh
        run: bash scripts/rehearse-drift.sh

      # The pin check (#89). Two failure modes, both invisible in production
      # until the day they matter: reporting a clean host while blind, and
      # reporting drift for a container that is merely not running. The second
      # would file a second issue for a fault Health Watch already owns.
      #
      # It also asserts the half that is not a script — that no image in
      # docker-compose.yml falls back to `:latest` — because that is the line
      # somebody restores by hand while making an unrelated change.
      - name: the pin check
        run: bash scripts/rehearse-pin.sh

      # The wiring rather than the scripts (#104). Every triage script above was
      # rehearsed and correct while the four lines of `health-watch.yml` that
      # call them threw their exit status away — `bash -e` ended the step before
      # `status=$?` could read it, so a drifted host killed the watcher at the
      # moment it had something to say. Two of three watchers went quiet for a
      # day behind a green health report.
      - name: the health watcher's own wiring
        run: bash scripts/rehearse-watch-wiring.sh

      # The balance alarm (#83). An alarm's two failure modes — silent when it
      # should fire, and firing on a blip — are both invisible in production
      # until the day they matter, and the balance had four hundred messages of
      # headroom on 2026-08-05. Stubs are the only place either can be seen.
      - name: the Twilio balance row
        run: bash scripts/rehearse-twilio-balance.sh

      # `rehearse-helius-webhook.sh` stood here — 48 assertions against the
      # deposit-address sync (#73). The script and its rehearsal went with the
      # module (`kolonie-platform#506`, `#94`). Its one lasting lesson is kept
      # rather than deleted with it: **that rehearsal existed and ran nowhere**
      # for two days, written with the script and never added here, which is #38
      # again and the reason this workflow exists at all.

      # The third leg of the drift check (#90) — the variables the deployed code
      # reads that `docker-compose.yml` never passes, which are permanently
      # empty in production and which `env-drift.sh` is structurally unable to
      # see. Two defects have shipped that way.
      #
      # The stubs are the point here as everywhere: today's tree is clean, which
      # is what installing the check achieves, so the properties worth asserting
      # — that it resolves `process.env[SOME_CONST]`, and that it excludes tests
      # by path — can only be shown against a fixture.
      - name: code-drift.sh
        run: bash scripts/rehearse-code-drift.sh

      # The image prune (#91). It is the only script here that *deletes* on the
      # deploy host, so what the stubs are for is the half a live run cannot
      # show: on a healthy host the rollback target is also the running image
      # and every protection covers it at once. The fixtures pull them apart and
      # assert the recorded digest survives a margin it falls outside of.
      - name: image-prune.sh
        run: bash scripts/rehearse-image-prune.sh

      # Syntax alone would not have caught anything above, but it is free and it
      # catches the class of mistake that never reaches a test case.
      - name: shell syntax
        run: |
          fail=0
          for f in scripts/*.sh; do
            bash -n "$f" || { echo "syntax error in $f"; fail=1; }
          done
          exit "$fail"
