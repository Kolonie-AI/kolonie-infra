# Traefik Static Configuration
# Kolonie AI — Production

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

# Let's Encrypt via Cloudflare DNS Challenge
certificatesResolvers:
  cloudflare:
    acme:
      email: admin@kolonie.ai
      storage: /certs/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10s

api:
  dashboard: false
  insecure: false

# File provider for routing (Docker provider disabled due to API version issue)
providers:
  file:
    directory: /dynamic
    watch: true

log:
  level: INFO

accessLog: {}
