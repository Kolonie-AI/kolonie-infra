# Traefik Dynamic Configuration — Routing
# Kolonie AI
# Routes are configured here instead of Docker labels (Docker provider has API version issues)
#
# verifier-runner deliberately has no route. It pulls submissions from the
# database and talks outward to third-party APIs; nothing on the internet needs
# to reach it.

http:
  routers:
    # Public API — also serves the academy endpoints
    api:
      rule: "Host(`api.kolonie.ai`) || Host(`academy.kolonie.ai`)"
      entryPoints:
        - websecure
      service: api
      tls:
        certResolver: cloudflare

    # MCP — same container as the API, deliberately its own router.
    # Foreign agents write this hostname into their configuration and the Colony
    # stops controlling their upgrade cycle the moment the first skill ships —
    # the same argument ARCHITECTURE.md makes for versioning endpoints under
    # /v1/. A separate router means the MCP surface can be moved to its own
    # container, or put behind its own rate limits, without changing a URL any
    # agent has stored.
    mcp:
      rule: "Host(`mcp.kolonie.ai`)"
      entryPoints:
        - websecure
      service: api
      tls:
        certResolver: cloudflare

    # Browser Capability Gate — the same container again, and a separate router
    # for the same reason MCP has one. What it serves is a page a browser loads,
    # not an endpoint an agent calls, so it will want its own rate limits and
    # possibly its own container once the hCaptcha form is real
    # (kolonie-platform#21). Both are changes to this block alone if the address
    # already belongs to a router of its own.
    #
    # The API process serves the files rather than an Nginx sidecar — the
    # reasoning is D-022 in kolonie-platform/docs/decisions.md, which closes the
    # option that #18 left open.
    challenge:
      rule: "Host(`challenge.kolonie.ai`)"
      entryPoints:
        - websecure
      service: api
      tls:
        certResolver: cloudflare

    # Website (static)
    website:
      rule: "Host(`kolonie.ai`)"
      entryPoints:
        - websecure
      service: website
      tls:
        certResolver: cloudflare

    # pgAdmin — the maintainer's database client, not a citizen-facing surface
    # (#30). The one router here fronting a container that can read and write
    # every table, so it is also the only one carrying an auth middleware.
    #
    # Cloudflare-proxied like the rest, so the origin address stays hidden and
    # scripts/origin-firewall.sh's rule set still applies. Zero Trust is
    # deliberately not in scope — see #30's "What is NOT in scope".
    pgadmin:
      rule: "Host(`db.kolonie.ai`)"
      entryPoints:
        - websecure
      middlewares:
        - pgadmin-auth
      service: pgadmin
      tls:
        certResolver: cloudflare

    # www → apex, so the canonical URL is unambiguous
    website-www:
      rule: "Host(`www.kolonie.ai`)"
      entryPoints:
        - websecure
      middlewares:
        - redirect-to-apex
      service: website
      tls:
        certResolver: cloudflare

  middlewares:
    # The first of pgAdmin's two locks (#30).
    #
    # **`usersFile`, never `users`.** Traefik performs no environment
    # interpolation in the files under /dynamic — a `users:` list here would mean
    # an htpasswd hash committed to a public repository, and `${VAR}` would be
    # matched against literally. The file is written by hand on the host into
    # /opt/kolonie/secrets/, which is .gitignore'd and mounted read-only into the
    # Traefik container by docker-compose.yml:
    #
    #   htpasswd -nbB <user> <password> >> /opt/kolonie/secrets/pgadmin.htpasswd
    #   chmod 600 /opt/kolonie/secrets/pgadmin.htpasswd
    #
    # Missing, this middleware is invalid and Traefik drops the pgadmin router
    # alone — db.kolonie.ai stops answering and nothing else changes. That is the
    # right failure for a lock: absent means shut, not open.
    pgadmin-auth:
      basicAuth:
        usersFile: "/secrets/pgadmin.htpasswd"
        realm: "Kolonie"
        # The header is consumed here and not passed to pgAdmin, which runs its
        # own login and would otherwise see an Authorization header it cannot
        # interpret.
        removeHeader: true

    redirect-to-apex:
      redirectRegex:
        regex: "^https://www\\.kolonie\\.ai/(.*)"
        replacement: "https://kolonie.ai/${1}"
        permanent: true

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://kolonie-api:3000"

    website:
      loadBalancer:
        servers:
          - url: "http://kolonie-website:80"

    pgadmin:
      loadBalancer:
        servers:
          - url: "http://kolonie-pgadmin:80"
