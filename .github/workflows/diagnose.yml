name: Diagnose VPS

# Read-only inspection of the deploy host, run on demand.
#
# It exists because the host is otherwise unreachable: the SSH key lives only as
# a repository secret, so a question like "which variables does /opt/kolonie/.env
# actually define" cannot be answered from a workstation. Every earlier attempt
# ended in a guess, and kolonie-infra#7 is the result of one.
#
# This workflow never prints a secret. It reports variable *names*, file
# presence and container state — never a value. Keep it that way: the log of a
# workflow run is not a private place.

on:
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  DEPLOY_DIR: /opt/kolonie

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Inspect the deploy host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -u
            cd ${{ env.DEPLOY_DIR }}

            echo "=== .env ==="
            if [ -f .env ]; then
              echo "present, $(wc -l < .env) lines"
              echo "--- variable names only, values never printed ---"
              grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' .env | tr -d '=' | sort
              echo "--- names defined but empty ---"
              grep -E '^[A-Za-z_][A-Za-z0-9_]*=$' .env | tr -d '=' | sort || echo "(none)"
            else
              echo "MISSING — this alone explains every failed deploy"
            fi

            echo
            echo "=== compose interpolation ==="
            if docker compose config --quiet 2>/tmp/compose.err; then
              echo "OK — the file interpolates"
            else
              echo "FAILS:"
              cat /tmp/compose.err
            fi

            echo
            echo "=== compose interpolation, --profile full ==="
            if docker compose --profile full config --quiet 2>/tmp/compose-full.err; then
              echo "OK"
            else
              echo "FAILS:"
              cat /tmp/compose-full.err
            fi

            echo
            # Replaces the hand comparison this workflow used to invite: it
            # printed the host's names and left whoever read the log to diff them
            # against .env.example by eye. That is how #8 sat open with a table
            # that was already stale by the time anyone acted on it. The script
            # prints names only, same rule as everything above it.
            echo "=== environment drift (names only, never values) ==="
            chmod +x scripts/env-drift.sh
            ./scripts/env-drift.sh . || echo "(drift reported above — this step does not fail the run)"

            echo
            # The other list this repository hard-codes and Cloudflare owns (#56).
            # Same rule as above: a stale list is a thing to notice, not a reason
            # to break a diagnosis, so this does not fail the run either.
            echo "=== Cloudflare range drift ==="
            chmod +x scripts/cloudflare-ranges.sh
            ./scripts/cloudflare-ranges.sh || echo "(reported above — this step does not fail the run)"

            echo
            # #70 split one OpenRouter key into one per consumer, and left a
            # question the sections above cannot answer: a name can be present,
            # non-empty and interpolated, and still be a key that does not work.
            # The failure is silent by construction — an unauthorised runner
            # leaves entries `pending`, which is indistinguishable from a quiet
            # week.
            #
            # `GET /api/v1/key` answers as the key that asked. **The key is sent
            # and never printed.**
            #
            # **It cannot tell you which key it is, and do not add a check that
            # claims otherwise.** Measured 2026-08-03: the response carries no
            # `name` field — the whole set is `byok_usage*`, `creator_user_id`,
            # `expires_at`, `include_byok_in_limit`, `is_free_tier`,
            # `is_management_key`, `is_provisioning_key`, `label`, `limit`,
            # `limit_remaining`, `limit_reset`, `rate_limit`, `usage*` — and
            # `label` comes back as a masked fragment of the key itself
            # (`sk-or-v1-ad8...029`), not the name the key was created with.
            #
            # An earlier version of this step read `label`, saw that, and
            # reported all three keys as unnamed. **They are named**; the
            # endpoint just does not expose it. The names live in the account,
            # readable only through the provisioning API, which needs a
            # provisioning key — a credential #70 declined to store for exactly
            # this class of cosmetic question. So this reports what it can
            # actually see: whether the key authenticates, and what it has spent.
            echo "=== OpenRouter keys, one per consumer (#70) ==="
            set -a; . ./.env; set +a
            for v in OPENROUTER_API_KEY_VERIFIER OPENROUTER_API_KEY_MODERATION OPENROUTER_API_KEY_TRIAGE; do
              key=$(eval "printf '%s' \"\${$v:-}\"")
              if [ -z "$key" ]; then echo "$v: not set"; continue; fi
              body=$(curl -s -m 15 -H "Authorization: Bearer $key" https://openrouter.ai/api/v1/key || true)
              ok=$(printf '%s' "$body" | jq -r 'if .data then "yes" else "no" end' 2>/dev/null || echo "no")
              limit=$(printf '%s' "$body" | jq -r '.data.limit // "none"' 2>/dev/null || echo "?")
              used=$(printf '%s' "$body" | jq -r '.data.usage // "?"' 2>/dev/null || echo "?")
              if [ "$ok" != "yes" ]; then echo "$v: REFUSED — the key does not authenticate"; continue; fi
              echo "$v: ok, spent $used against a limit of $limit"
            done

            echo
            echo "=== containers ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            echo
            echo "=== repository checkout ==="
            git log --oneline -1
            git status --porcelain || true
