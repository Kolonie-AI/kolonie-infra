# Container logs that cannot fill the disk (#37).
#
# Docker's default json-file driver has **no cap at all**: a container logs until
# the partition is full, and then every service on the host fails at once for a
# reason none of their logs can record, because there is nowhere left to record
# it. Nothing on this host rotated container logs before this.
#
# 50 MB across 3 files is 150 MB per container and about 900 MB for the stack —
# affordable on this disk, and long enough to still hold a startup exception a
# day later. That matters more here than usual: since kolonie-infra#43 the deploy
# quotes a failing container's log before rolling it back, and a rotation window
# shorter than the gap between a bad deploy and somebody reading about it would
# quietly hollow that out.
#
# Applied per service through a YAML anchor rather than daemon.json, so the
# policy is in the file that is reviewed and deployed rather than in host state
# nothing here can see — the class of gap kolonie-infra#42 is about.
#
# **This takes effect when a container is recreated, not when the file changes.**
# A running container keeps the policy it started with.
#
# **`labels:` is not cosmetic — it is what lets Promtail work without the Docker
# socket** (#68). Named here, the json-file driver copies that container label
# into an `attrs` object on every line it writes, and Compose sets
# `com.docker.compose.service` on everything it starts. So the log file itself
# carries the service name, and `promtail/promtail.yml` reads it from there.
#
# The alternative is Promtail's `docker_sd_configs`, which discovers the same
# names over `/var/run/docker.sock` — a mount that gives that container root on
# the host. This option is what makes refusing that mount free rather than a
# trade. Remove it and Promtail's `service` label silently becomes empty: every
# container's lines merge into one unlabelled stream and every query in
# kolonie-docs#133 stops distinguishing services. That is the one coupling
# between this file and that one.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
    labels: "com.docker.compose.service"

networks:
  kolonie:
    name: kolonie
    driver: bridge

volumes:
  postgres_data:
  traefik_certs:
  pgadmin_data:
  # Loki's chunks, its TSDB index and the compactor's working directory (#68).
  # Named, so it survives a container being recreated — which is the whole point
  # of the store: Docker's own json-file logs are lost the moment a deploy
  # replaces the container that wrote them.
  loki_data:
  # Promtail's read positions. Also named, and for a sharper reason: without it
  # a recreated Promtail re-reads every log file from byte zero and every line
  # already in Loki arrives a second time.
  promtail_positions:

services:
  # === Traefik Reverse Proxy ===
  traefik:
    image: traefik:v3.7
    container_name: kolonie-traefik
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--configFile=/traefik.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - traefik_certs:/certs
      # Credentials the *dynamic configuration* needs, which is a different
      # problem from the ones .env solves (#30).
      #
      # Traefik does not interpolate environment variables in the files under
      # /dynamic. A basicAuth middleware therefore has exactly two ways to learn
      # its htpasswd line: written literally into traefik/dynamic/routes.yml,
      # which puts a password hash into a public repository, or read from a file
      # through `usersFile`. This mount is the second.
      #
      # The directory is untracked and .gitignore'd; deploy.sh's `git reset
      # --hard` does not touch untracked paths, so what an operator writes here
      # survives every deploy. A missing file is not an outage: Traefik logs the
      # middleware as invalid and drops the one router that references it, and
      # every other router keeps serving.
      - ./secrets:/secrets:ro
    # The two sides are different names on purpose, and neither is a typo.
    #
    # Left: what lego expects inside the Traefik container for the Cloudflare DNS
    # challenge. Right: what /opt/kolonie/.env on the deploy host actually
    # defines — verified by the diagnose workflow, not assumed.
    #
    # An earlier fix set both sides to CLOUDFLARE_DNS_API_TOKEN on the belief
    # that .env used that name. It does not, and marking the variable required
    # with :? turned a silent empty string into a hard failure of every deploy.
    # See #7.
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: kolonie-postgres
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    # Who is connected, on every session line (#80).
    #
    # The default prefix is `%m [%p] ` — a timestamp and a process id — so an
    # `ERROR` from the platform and an `ERROR` from a maintainer typing at a
    # `psql` prompt were the same line to anything reading them. Measured over
    # 24 hours to 2026-08-05, every one of the 26 postgres errors in the logs was
    # somebody typing.
    #
    # `%q` omits everything after it for a process with no session, so the
    # checkpointer's lines are unchanged. A session's lines gain
    # `<user>@<database>/<application name>`, which is what Promtail reads to
    # tell an incident from a typo — see `promtail/promtail.yml`, stage 5a.
    #
    # Logging settings only. Nothing here changes what the server accepts, what
    # it stores, or how it performs.
    command:
      - "postgres"
      - "-c"
      - "log_line_prefix=%m [%p] %q%u@%d/%a "
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolonie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kolonie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolonie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Public API + MCP (kolonie-platform / apps/api) ===
  # Serves api.kolonie.ai, academy.kolonie.ai, mcp.kolonie.ai and
  # challenge.kolonie.ai. Routing lives in
  # traefik/dynamic/routes.yml, not in labels — see the note there.
  #
  # Every image this organisation builds carries a variable whose fallback is a
  # tag that **does not exist and never will**. `deploy.sh` resolves each tag to
  # an immutable digest after pulling and exports that, so the containers it
  # starts are pinned to a build that cannot change underneath them and can be
  # returned to later (#12). The fallback is what happens when nothing did.
  #
  # **It used to be `:latest`, and that is the defect #89 was filed for.** The
  # pins live in exactly one place — `state/deployed.env`, which `deploy.sh`
  # writes and sources — and `/opt/kolonie/.env` defines none. So any
  # `docker compose up -d` that did not source `deployed.env`, by hand or from a
  # half-finished recovery, silently replaced a digest-pinned container with
  # whatever `:latest` then resolved to. It exited zero, reported success and
  # came up healthy, because an older build *is* healthy. On 2026-08-06 that ran
  # production on an api two days and 212 commits behind for about ninety
  # minutes, and the only thing that changed was which code served.
  #
  # The sharp part is that `:latest` had not moved since 2026-08-04, because
  # every build after it had failed. **The floating tag is at its most wrong in
  # the one situation that reaches for it** — a safety net woven from the same
  # thread as the fall.
  #
  # **Why a sentinel tag rather than `${API_IMAGE:?}`.** `:?` was #89's own
  # suggestion and it is the wrong instrument here for a reason this file
  # already records under `pgadmin`: it fails `docker compose` **as a whole**,
  # and this file is parsed on every invocation including the ones that never
  # touch these services. `README.md`'s bootstrap starts `traefik` and
  # `postgres` on a fresh host before any deploy has run, and `docker compose ps`
  # is what a person types when something is wrong; `:?` breaks both to guard
  # neither. The sentinel fails exactly where it should — at the pull, when an
  # application container is actually being started unpinned — and the tag names
  # its own remedy in the error message.
  #
  # Whether the host is running what the record says is a separate question and
  # a measurement rather than a hope: `scripts/pin-report.sh | scripts/pin-triage.sh`.
  api:
    image: ${API_IMAGE:-ghcr.io/kolonie-ai/kolonie-api:PIN-NOT-SET-SEE-STATE-DEPLOYED-ENV}
    container_name: kolonie-api
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      JWT_SECRET: ${JWT_SECRET}
      # The Auth0 `sub` of the identity that holds the `maintainer` role
      # (kolonie-platform#485). Granted at startup, once, and idempotent.
      #
      # **`:-` and never `:?`.** It is deliberately optional: `preflight_env()`
      # refuses a deploy whose host cannot supply a declared name, so declaring
      # this one would break every deployment that has no maintainer to
      # bootstrap — including every future one, since it is only ever needed
      # once. `kolonie-platform`'s `required-env.test.ts` asserts it is declared
      # nowhere, from the other side.
      #
      # Passed here for the reason kolonie-infra#90 exists: the api reads it, and
      # this file is the only way a host value reaches the container. Setting it
      # on the host without this line would have done nothing at all — which is
      # exactly the shape of #480 and #482, caught this time by the check rather
      # than by a citizen.
      BOOTSTRAP_MAINTAINER_SUBJECT: ${BOOTSTRAP_MAINTAINER_SUBJECT:-}
      # The name a person's mail client shows as the sender
      # (kolonie-platform#483). Unset sends a bare address, which is what the
      # Colony sent before that issue — so this is safe to leave empty and is
      # the one thing that makes the mail read as coming from `Kolonie AI`
      # rather than from `Konsole`, which is what a client invents from the
      # local part when no display name is sent.
      #
      # **Wired here because #483 shipped without it and the variable reached
      # nothing.** `code-drift.sh` did not catch it either: `mailerFromEnv`
      # reads it off an aliased `env` parameter rather than `process.env`, and
      # the check only matched the latter. Both are fixed in the same commit —
      # kolonie-infra#90.
      MAIL_SENDER_NAME: ${MAIL_SENDER_NAME:-}
      # Salts the hashes of identifiers a *banned* citizen proved, which are the
      # only thing an erasure leaves behind (kolonie-platform#90, #92). An
      # unsalted digest of a mailbox address is reversible with a wordlist, so
      # `packages/db` refuses to start without it rather than writing marks that
      # protect nothing.
      #
      # **`:?` rather than a default, and the shape of the outage that earned it.**
      # This variable landed with #93 on 2026-07-30 and reached neither this file
      # nor the host's .env. Every deploy since then failed the same way: the api
      # container threw at startup, sat unhealthy for 180s, and the deploy rolled
      # back — six times, each one looking like a health-check problem rather than
      # a missing variable. That is #7 exactly, one variable over. With `:?`,
      # Compose names it and stops before anything moves.
      BAN_MARK_SALT: ${BAN_MARK_SALT:?set BAN_MARK_SALT in .env — openssl rand -hex 32}
      HCAPTCHA_SITEKEY: ${HCAPTCHA_SITEKEY}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET}
      # Where the hCaptcha badge's page lives. It has a default here rather than
      # being required in .env because kolonie-platform may not contain a host
      # name in any file (its AGENTS.md §3), so the API composes the agent-facing
      # url from configuration and this is the configuration. A routing fact
      # belongs in the repository that owns routing.
      CHALLENGE_PAGE_URL: ${CHALLENGE_PAGE_URL:-https://challenge.kolonie.ai/captcha/}
      # The same read-only token the verifier-runner holds, and deliberately the
      # same variable name — one credential, one name, which is kolonie-infra#7's
      # whole lesson (.env defined CLOUDFLARE_API_TOKEN while compose demanded
      # CLOUDFLARE_DNS_API_TOKEN, and every deploy failed for days).
      #
      # The api needs it for `kolonie.contributions.list` (kolonie-docs#43): a
      # citizen asking which of its own pull requests a reviewer has answered.
      # That is a read of somebody else's system from the request path, which no
      # other api surface does — every other Academy rung here either mints a
      # nonce or checks a signature.
      #
      # Unset is a working configuration and not a degraded one. The tool then
      # reports that the Colony **could not ask**, which is deliberately not the
      # same answer as "nothing is waiting on you" — an agent told the second
      # when the first is true goes back to sleep on a review it needed, which is
      # the exact bug kolonie-docs#43 exists to close.
      GITHUB_VERIFIER_TOKEN: ${GITHUB_VERIFIER_TOKEN:-}
      # Where Academy Level 1 lives — the rung that promotes (kolonie-platform
      # D-029). Same arrangement as the line above, and deliberately **not**
      # grouped with the HCAPTCHA_ variables.
      #
      # The whole point of the Level 1 rebuild is that a promoting rung depends
      # on nothing an outside party controls. Until 2026-07-29 one condition
      # covered the entire Academy surface, so an unset hCaptcha sitekey — a
      # third party's value, for a task that is now optional — disabled Level 1
      # and stalled every arriving agent. kolonie-platform has a test that fails
      # if that coupling comes back in its code; this comment is the same
      # guard one layer down, where no test can see it. Do not make this
      # conditional on the hCaptcha values.
      CAPABILITY_PAGE_URL: ${CAPABILITY_PAGE_URL:-https://challenge.kolonie.ai/browser/}
      # The four stages above the entry rung, added 2026-08-01 with
      # kolonie-platform#160-#164. Each stage resolves its own address and
      # disables only itself when that address is unset, saying so in the startup
      # line — which is the same lesson as the block above, one level further:
      # one shared condition is how an unset third-party value took a whole
      # branch down. A stage missing from here is a stage that refuses its own
      # mints and leaves the rest of the ladder standing.
      #
      # Defaults rather than required values, because the pages are served by
      # this same API container on paths it registers itself. There is no secret
      # here and nothing a third party owns; the host name is configuration
      # because kolonie-platform may hold none.
      PERSISTENCE_PAGE_URL: ${PERSISTENCE_PAGE_URL:-https://challenge.kolonie.ai/persistence/}
      PERCEPTION_PAGE_URL: ${PERCEPTION_PAGE_URL:-https://challenge.kolonie.ai/perception/}
      INTERACTION_PAGE_URL: ${INTERACTION_PAGE_URL:-https://challenge.kolonie.ai/interaction/}
      INTERSTITIAL_PAGE_URL: ${INTERSTITIAL_PAGE_URL:-https://challenge.kolonie.ai/interstitial/}
      # Academy Level 2, the mailbox rung. Same arrangement as the two page urls
      # above: kolonie-platform may hold no host name, so the domain challenge
      # addresses are minted under is configuration and arrives here.
      EMAIL_CHALLENGE_DOMAIN: ${EMAIL_CHALLENGE_DOMAIN:-challenge.kolonie.ai}
      # No default, and no `:?` either. Unset, the API leaves the inbound route
      # unmounted — which is the correct behaviour and must stay reachable, so
      # this may not be made mandatory. A default would be worse still: it would
      # be a shared secret published in a public repository.
      EMAIL_INBOUND_SECRET: ${EMAIL_INBOUND_SECRET:-}
      # The API sends the Level 2 code itself. All three together or none: the
      # rung answers 503 unless it can actually deliver, rather than handing an
      # agent a challenge whose code has nowhere to go.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_SEND_TOKEN: ${CLOUDFLARE_EMAIL_SEND_TOKEN:-}
      ACADEMY_SENDER_ADDRESS: ${ACADEMY_SENDER_ADDRESS:-}
      # Who console mail comes from, separately from the Academy's challenge host
      # (kolonie-platform#398, #405). Optional and falling back to the line above,
      # which is deliberate: console mail failing entirely because the console has
      # no address of its own would be worse than the defect it fixes.
      #
      # **Listed here for the reason the rhythm bounds below are listed here.**
      # This service has no `env_file`, so until this line existed the variable
      # was invisible to the container however carefully it was set in `.env` —
      # and the symptom would have been the worst kind: `.env` says the console
      # has its own sender, mail keeps arriving from the Academy's challenge
      # host, and nothing anywhere reports a problem.
      CONSOLE_SENDER_ADDRESS: ${CONSOLE_SENDER_ADDRESS:-}
      # The wake-up rhythm bounds (#61, kolonie-platform#142). Optional: absent
      # means the default compiled into the API — 6 / 12 / 24 hours — and a
      # deployment that sets none of the three is not diminished, which is why
      # they carry `:-` and are not in REQUIRED_ENV.
      #
      # **They are listed here because otherwise .env cannot reach them.** This
      # service has no `env_file`, so a variable that is not named in this block
      # is invisible to the container however carefully an operator sets it. That
      # was the state until 2026-08-02: `apps/api/src/rhythm.ts` read three
      # variables that nothing in this repository passed, so the configuration
      # #142 built existed and could not be used.
      #
      # RHYTHM_MIN_HOURS is the one expected to fall, once Quests give a citizen
      # a reason to come back more often than the Academy does. Lowering it is a
      # deploy setting rather than a release plus four skill re-publications, and
      # that is the whole point of #142.
      #
      # A contradictory range — a minimum above the maximum, or a default outside
      # the range — makes the API throw at startup. Deliberately: it is a
      # configuration mistake that otherwise produces a Colony behaving strangely
      # rather than one visibly broken, and startup is where an operator is
      # watching.
      RHYTHM_MIN_HOURS: ${RHYTHM_MIN_HOURS:-}
      RHYTHM_DEFAULT_HOURS: ${RHYTHM_DEFAULT_HOURS:-}
      RHYTHM_MAX_HOURS: ${RHYTHM_MAX_HOURS:-}
      # The seal on the secret half of every deposit address
      # (kolonie-platform#219). `:?` and not `:-`, which puts it in the small
      # company of BAN_MARK_SALT above, for the same reason: the API reads it at
      # startup and **refuses to boot without it**, deliberately — a process that
      # cannot protect a keypair must not generate one. Failing here rather than
      # in the container turns that into a message an operator can act on
      # instead of a restart loop.
      DEPOSIT_SEALING_KEY: ${DEPOSIT_SEALING_KEY:?set DEPOSIT_SEALING_KEY in .env — openssl rand -hex 32}
      # The rest of the quest programme's configuration, all optional and all
      # failing closed (kolonie-infra#72). They are named here because otherwise
      # `.env` cannot reach them: this service has no `env_file`, which is the
      # trap #142 fell into — three variables the API read and nothing passed.
      #
      # Absent, each one withholds a feature rather than breaking one:
      #   - no DEPOSIT_WEBHOOK_SECRET, and the deposit webhook route is not
      #     mounted at all. The rule EMAIL_INBOUND_SECRET follows, for the same
      #     reason: the endpoint turns *money arrived* into a balance
      #   - no QUEST_AUDIT_ENABLED, and a quest with a non-zero reward cannot be
      #     published (kolonie-platform#221). Correct for the pilot, which pays
      #     nothing; it has to become `true` before the first paying quest, and
      #     that is a decision rather than a deploy step
      #   - no CONSOLE_URL, and no console is served at all — rather than one
      #     served at the API's own host, where nothing expects a form
      #   - no RPC_URL, and the reconciliation pass reports zeros. The webhook
      #     still credits; what is lost is the recovery of a delivery it missed,
      #     which is the difference between a delay and a loss (#72)
      # The seal on a waiting operator drop (kolonie-platform#410) — the channel
      # an operator hands its agent a code or a credential down.
      #
      # **`:-` and not `:?`, which is the one way it differs from
      # `DEPOSIT_SEALING_KEY` four lines up.** That key protects money and the
      # API refuses to boot without it. This one protects a convenience, and
      # making it required would have meant that shipping the feature stopped
      # every existing deployment from starting. Unset, the three drop tools
      # answer `conflict` and say the Colony has no such channel — the same shape
      # the SMS adapter uses for absent configuration.
      #
      # **Not the same value as DEPOSIT_SEALING_KEY.** One key with two purposes
      # is one rotation that cannot be done for either of them.
      OPERATOR_DROP_SEALING_KEY: ${OPERATOR_DROP_SEALING_KEY:-}
      DEPOSIT_WEBHOOK_SECRET: ${DEPOSIT_WEBHOOK_SECRET:-}
      # The Colony's own wallet — D-106, kolonie-platform#503.
      #
      # **`:-` and not `:?`, and the check that matters is not presence.** Both
      # halves absent is a deployment that takes no money and mounts no payment
      # routes, which is every environment that is not this one. What the API
      # refuses to start on is the pair *disagreeing*: `PAYOUT_WALLET_SECRET` is
      # the raw 32-byte Ed25519 seed and every SDK's `fromSecretKey` expects 64
      # bytes, so handing one to the other derives a different address without
      # throwing — and the first symptom would be a transfer signed by an account
      # holding nothing. The process derives the address at startup and compares.
      #
      # **`TREASURY_ADDRESS` is an address and never a key.** The Colony sends to
      # it and holds nothing for it; the seed phrase is the maintainer's
      # (kolonie-docs#202). `kolonie-platform#507` asserts that no code path can
      # send *from* it.
      PAYOUT_WALLET_ADDRESS: ${PAYOUT_WALLET_ADDRESS:-}
      PAYOUT_WALLET_SECRET: ${PAYOUT_WALLET_SECRET:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
      QUEST_AUDIT_ENABLED: ${QUEST_AUDIT_ENABLED:-}
      QUEST_AUDIT_RATE: ${QUEST_AUDIT_RATE:-}
      CONSOLE_URL: ${CONSOLE_URL:-}
      RPC_URL: ${RPC_URL:-}
      # Signing in as a *person* (kolonie-platform#425): an Auth0 tenant, and
      # the console application registered inside it.
      #
      # **Not `:?`, for the reason the block below gives.** A Colony with no
      # tenant configured must still deploy: the console then offers the mail
      # link alone, which is what it offered before #425 existed. The API refuses
      # to render a provider button whose redirect has nowhere to go, so a
      # half-configured deployment shows a stranger nothing rather than showing
      # them somebody else's error page.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CONSOLE_CLIENT_ID: ${AUTH0_CONSOLE_CLIENT_ID:-}
      AUTH0_CONSOLE_CLIENT_SECRET: ${AUTH0_CONSOLE_CLIENT_SECRET:-}
      # Twilio, for the SMS rungs (#82, kolonie-platform#409).
      #
      # **Sending belongs here** — a citizen asks for a code and one goes out on
      # that request — and **polling for inbound belongs to the verifier runner**,
      # where every other verifier that reaches outside already lives. Both need
      # the credentials and only one needs to be able to send. That asymmetry is
      # worth keeping if Twilio ever offers a send-only key; today its key is one
      # key, so both get the same one and this paragraph is why that is not an
      # oversight.
      #
      # **Not `:?`, deliberately, and this is the whole of the decision.** A
      # Colony without SMS configured must still deploy: the adapter's contract
      # is that absent configuration means the rung is unavailable, not that the
      # process dies. `#7` is what `:?` on an unset variable costs.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # The spend ceiling, which has to come from our side because Twilio has no
      # true prepaid mode. Unset means the defaults compiled into the adapter —
      # DE, AT, CH, GB, US · five per citizen per day · two hundred in total —
      # and those are documented in `.env.example` §Twilio beside the prices they
      # were chosen against. Here so that raising one is an `.env` edit rather
      # than a release.
      SMS_ALLOWED_DESTINATIONS: ${SMS_ALLOWED_DESTINATIONS:-}
      SMS_MAX_PER_CITIZEN: ${SMS_MAX_PER_CITIZEN:-}
      SMS_MAX_PER_DAY: ${SMS_MAX_PER_DAY:-}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than localhost, for the reason spelled out on the
      # website service below. curl happens to retry the other address family
      # where wget does not, so this one was not failing — but relying on that
      # difference between two tools is not a property worth depending on.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-w", "health %{http_code}", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - full

  # === Verifier Runner (kolonie-platform / apps/verifier-runner) ===
  # No Traefik route on purpose: it pulls submissions from the database and
  # talks outward to third-party APIs. Nothing on the internet reaches it.
  verifier-runner:
    image: ${RUNNER_IMAGE:-ghcr.io/kolonie-ai/kolonie-verifier-runner:PIN-NOT-SET-SEE-STATE-DEPLOYED-ENV}
    container_name: kolonie-verifier-runner
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      GITHUB_VERIFIER_TOKEN: ${GITHUB_VERIFIER_TOKEN:-}
      # The Mastodon allow-list the social rung checks an instance against
      # (kolonie-platform#482), passed because the code reads it and this file is
      # the only way a host value reaches the container — kolonie-infra#90.
      #
      # **It was read and never passed, so setting it on the host did nothing.**
      # That is the second instance of the defect #90 exists to catch, and it is
      # named here rather than left to the check to keep reporting: a gate that
      # is red on the day it is installed is a gate people switch off.
      #
      # Whether the list belongs in code rather than in a variable is
      # kolonie-platform#482's question and is not settled by passing it. Unset
      # is a working configuration — the code falls back to its own list.
      MASTODON_VERIFIER_INSTANCES: ${MASTODON_VERIFIER_INSTANCES:-}
      # Solana, for the four earning rungs (kolonie-platform #61, #63, #64, #65).
      # Unset is a working configuration and not a degraded one: the code falls
      # back to Solana's own public mainnet endpoint, which needs no credential.
      # Set this to a paid endpoint when the free one's rate limit starts showing
      # up as submissions sitting `pending` — that is the symptom, and it costs an
      # agent nothing but time, because an unreadable endpoint re-queues rather
      # than failing anyone.
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      # The image rung (kolonie-platform#60) hands a picture to a vision model.
      #
      # **Its own OpenRouter key, mapped onto the name the code reads**
      # (kolonie-infra#70). This used to be the shared `OPENROUTER_API_KEY`, on
      # the grounds that one account means one credential and one name — and the
      # reason to split is not security but **attribution**: OpenRouter reports
      # spend per key, so *"is triage or moderation burning the money"* had no
      # answer while three services spent through one. Two further effects
      # follow: a leak forces one consumer to rotate rather than four, and a
      # per-key credit limit means a runaway loop can only exhaust its own
      # budget.
      #
      # **This does not reverse kolonie-infra#7.** That was two variable *names*
      # for one credential, where the second name was a synonym nobody could see
      # was a synonym. These are five different credentials, each named for who
      # spends it, and the application still reads exactly one name.
      #
      # Defaulted to empty for the reason spelled out on the moderation runner
      # below — an unset key has to degrade this service rather than take it
      # down. It degrades differently here, and worse: image submissions verdict
      # `pending` and wait, so the rung is seeded `draft` until this is set.
      # Per-service now, which keeps that property where it matters most: a typo
      # in one of these names degrades one service instead of failing the stack.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY_VERIFIER:-}
      # Which model looks at the image. Unset means the code's own default, the
      # same arrangement OPENROUTER_MODEL has one service down. It has to accept
      # an image *and* honour a JSON schema, which rules out most cheap vision
      # models rather than a few.
      VISION_MODEL: ${VISION_MODEL:-}
      # Which model judges the second image rung (kolonie-platform#216).
      # Deliberately a different variable from VISION_MODEL above, because the
      # two rungs ask different questions: `raster` asks whether the background
      # is blue, which a cheap vision model answers well, and `image-model` asks
      # how many otters are in a picture, which a small one gets wrong often
      # enough to fail work that was right. One shared variable would price both
      # at whichever is more demanding. Unset means the code's own default.
      SCENE_VISION_MODEL: ${SCENE_VISION_MODEL:-}
      # Which model reads a citizen's bio at Academy Level 0
      # (kolonie-platform#137). A text model, not the vision one: the question
      # has no image in it. Unset means the code's own default.
      #
      # **Unlike every other model variable here, leaving this unset does not
      # park a rung.** Level 0 stands in front of the whole graph, so an
      # unreachable judge degrades towards *passing* — a citizen that wrote a
      # real bio is certified on the structural bar alone, and the verdict
      # records that nobody read it. An outage of ours must not close the door.
      BIO_MODEL: ${BIO_MODEL:-}
      # Which model reads a quest report against the sponsor's own questions
      # (kolonie-platform#177). Unset means the code's own default, like the two
      # above.
      #
      # **An unreachable judge parks a report; it never fails one.** The verifier
      # answers `pending` and the runner retries until the quest's timeout, which
      # is #170's rule: the Colony's own latency must not be recorded as the
      # citizen's failure. That is the opposite of BIO_MODEL's degradation one
      # line up, and deliberately so — there the door must not close, here money
      # may depend on the verdict.
      QUEST_JUDGE_MODEL: ${QUEST_JUDGE_MODEL:-}
      # Twilio, the reading half (#82, kolonie-platform#409).
      #
      # The runner polls for inbound messages, which is where every verifier that
      # reaches outside already lives — and it is the same one key the API gets,
      # for the reason spelled out on that service. **It never sends**, so this
      # service having a key that could is the asymmetry named there and not an
      # accident.
      #
      # No `:?` here either. A runner with no Twilio configuration parks the two
      # phone rungs and runs every other verifier normally, which is the same
      # shape `SOLANA_RPC_URL` and the model variables above have.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      POLL_INTERVAL_MS: ${VERIFIER_POLL_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Was `node -e "process.exit(0)"`, which asked whether the process exists
      # and reported healthy for a process wrapped around a dead polling loop —
      # exactly the class of lie in #11. The endpoint answers whether a poll has
      # completed recently, and 503 when it has not; `r.ok` turns that into the
      # exit code Compose actually reads.
      #
      # 127.0.0.1 rather than localhost, for the reason spelled out on the
      # website service below. No curl in this image, and none is added for one
      # request that Node can make itself.
      #
      # **It prints what it saw** (#54). Every branch used to end in a bare
      # `process.exit`, so a dead process, a 503 from a stalled poll loop and a
      # timeout were one exit code with no text between them — and they need
      # three different responses. On 2026-07-31 this container flapped for half
      # an hour and the complete record Docker held of why was `exit=1, exit=0,
      # exit=1, exit=1, exit=1`.
      #
      # A status number and an error code, and nothing else: `.State.Health.Log`
      # is read into a public issue by Health Watch, so no body, no headers, no
      # environment. One short line keeps the healthy path from burying the
      # failing entries — Docker keeps only the last five.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{console.log('health '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable: '+(e.cause?.code||e.code||e.message));process.exit(1)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Moderation Runner (kolonie-platform / apps/moderation-runner) ===
  # No Traefik route, for the same reason as the verifier runner: it reads
  # struggles and tips from the database and talks outward to OpenRouter.
  # Nothing on the internet reaches it.
  moderation-runner:
    image: ${MODERATION_IMAGE:-ghcr.io/kolonie-ai/kolonie-moderation-runner:PIN-NOT-SET-SEE-STATE-DEPLOYED-ENV}
    container_name: kolonie-moderation-runner
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      # This service's own OpenRouter key, mapped onto the name the code reads
      # (kolonie-infra#70). The reasoning is on the verifier runner above; the
      # short version is that spend is only attributable per key.
      #
      # Defaulted to empty rather than required. An unset key degrades this
      # service and stops nothing: entries stay `pending`, pending entries are
      # never served, and the read endpoints answer empty arrays. Compose
      # refusing to interpolate would instead take the container down, and the
      # health endpoint is how anyone would find out it was missing.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY_MODERATION:-}
      # Which model judges is a decision that will be revisited against a real
      # corpus, so it is configuration. Unset means the code's own default.
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
      # A minute, where the verifier runner polls every five seconds. Nothing
      # waits on a moderation verdict: an agent that filed a struggle was heard
      # when the row was written, and whether it is published is a question for
      # other agents, later.
      POLL_INTERVAL_MS: ${MODERATION_POLL_INTERVAL_MS:-60000}
      # **The tripwire's way of reaching a human** (kolonie-infra#77).
      #
      # When the moderator concludes that a provider has changed under a task,
      # this is the token the runner files the issue with. It had reached no
      # container at all since the tripwire shipped: the name was in neither this
      # file nor `.env.example`, and this service has no `env_file`, so setting it
      # on the host would have changed nothing and looked like it had. That is the
      # trap §8 of AGENTS.md records twice — a variable is three edits, not one.
      #
      # **Defaulted, and never `:?`.** An unset token must keep degrading the
      # runner to `noIssues` rather than refusing to start, which is the runner's
      # own documented decision and the right one: *"an unopened issue costs a
      # maintainer a discovery, and a moderation runner that refuses to start
      # costs every citizen its publication"*. Unset, it says so at `warn` on
      # every start, and that line is now readable in Loki.
      MODERATION_GITHUB_TOKEN: ${MODERATION_GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Same shape and same reason as the verifier runner's: `process.exit(0)`
      # reports healthy for a process wrapped around a dead polling loop (#11).
      # It matters more here — a stalled moderator publishes nothing, and a
      # Colony that publishes nothing looks exactly like one where nobody has
      # written anything.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>{console.log('health '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable: '+(e.cause?.code||e.code||e.message));process.exit(1)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Support Triage Runner (kolonie-platform / apps/support-triage-runner) ===
  # No Traefik route, for the same reason as the other two runners: it reads the
  # support tickets citizens filed over MCP and talks outward to OpenRouter and
  # GitHub. Nothing on the internet reaches it.
  support-triage-runner:
    image: ${TRIAGE_IMAGE:-ghcr.io/kolonie-ai/kolonie-support-triage-runner:PIN-NOT-SET-SEE-STATE-DEPLOYED-ENV}
    container_name: kolonie-support-triage-runner
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      BAN_MARK_SALT: ${BAN_MARK_SALT:?set BAN_MARK_SALT in .env — openssl rand -hex 32}
      # **The third of three, and the one the split was argued over.**
      # kolonie-platform#229 asked what triage costs, and it was unanswerable
      # while this service and the two above spent through one key
      # (kolonie-infra#70). Reasoning on the verifier runner.
      #
      # Defaulted to empty for the reason the moderation runner gives: an unset
      # key has to degrade this service rather than take it down. It degrades
      # quietly here, and the degradation is exactly the state that existed
      # before this service did — tickets accumulate `open` and nobody reads
      # them.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY_TRIAGE:-}
      # Which model triages. Unset means the code's own default.
      TRIAGE_MODEL: ${TRIAGE_MODEL:-}
      # The GitHub App this files issues as (kolonie-infra#55).
      #
      # **The id is not a secret and the key is**, so only the id is here. The id
      # is in the App's public URL; the RSA private key is multi-line and has no
      # business in a `.env`, so it lives in ./secrets — the directory Traefik's
      # htpasswd already uses, which deploy.sh creates and .gitignore covers —
      # and is mounted read-only below.
      #
      # Unset is a working configuration: the runner then reads tickets, matches
      # them against nothing, and files nothing. That is worse than working and
      # much better than a container that will not start.
      GITHUB_TRIAGE_APP_ID: ${GITHUB_TRIAGE_APP_ID:-}
      GITHUB_TRIAGE_APP_KEY_PATH: /secrets/kolonie-triage-app.pem
      # Half an hour, against the moderation runner's minute. Nothing waits on a
      # triage verdict the way a citizen waits on a moderation one — and a longer
      # tick means two reports of the same thing usually land in one pass and
      # produce one issue rather than two.
      #
      # It is also the log detector's tick (`kolonie-platform#407`), which is why
      # the target there is *within half an hour* rather than *within minutes*.
      POLL_INTERVAL_MS: ${TRIAGE_POLL_INTERVAL_MS:-1800000}
      # The Colony's own errors, as a second source into the same machinery
      # (`kolonie-platform#407`).
      #
      # **The credential the Watch Agent already reads with**, not a new one:
      # `#407` is explicit that minting a second where a fitting one exists is
      # the wrong trade, and `ARCHITECTURE.md` is deliberately strict about
      # stored credentials. It is the same `LOKI_WATCH_TOKEN` behind
      # `logs.kolonie.ai` (`#68`).
      #
      # **The internal name, not the public host.** Loki sits beside this
      # container; going out through Traefik would be asking the public edge for
      # a service on the same network — and it is what lets the basicAuth token
      # stay unnecessary on this path, which is why the user defaults to the
      # same `watch` and the token may be empty in a deployment that has not set
      # one up.
      #
      # Unset is a working configuration: the runner then triages tickets and
      # notices nothing in the logs, which is the state before `#407` existed.
      LOKI_URL: ${LOKI_INTERNAL_URL:-http://loki:3100}
      LOKI_USER: ${LOKI_USER:-watch}
      LOKI_TOKEN: ${LOKI_WATCH_TOKEN:-}
    # **Runs as the user that owns the key, and the numbers are measured.**
    #
    # The image ships `USER node`, which is uid 1000 inside it. The App key is
    # `0600` and owned by the deploy user, so as `node` this process gets EACCES
    # and files nothing — which it reports and survives, but it is not what
    # anybody wanted.
    #
    # The obvious fix is `chown 1000` on the host, and on this host it is wrong:
    # uid 1000 is **`admin`** and gid 1000 is **`wheel`**, both real. Handing a
    # private key to them because a container happened to pick the same numbers
    # is a widening disguised as a permission fix. Measured 2026-08-01, not
    # assumed — Traefik gets away with reading its htpasswd only because it runs
    # as root, and this service deliberately does not.
    #
    # So the container takes the deploy user's identity instead, and the key
    # stays `0600` with nothing on the host gaining access. A variable rather
    # than a literal because these numbers belong to *this* host: a rebuild that
    # lands on different ones sets it, and a wrong value degrades — the runner
    # logs EACCES and files nothing — rather than taking the container down.
    user: "${SECRETS_READER:-1001:1002}"
    volumes:
      # Read-only, and the same directory Traefik reads its htpasswd from. A
      # missing key is not an outage: the runner says so at startup and files
      # nothing.
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Same shape and same reason as the other two runners': `process.exit(0)`
      # reports healthy for a process wrapped around a dead polling loop (#11).
      #
      # The endpoint also serves the queue depth, and deliberately does not let a
      # deep queue answer 503 — a backlog is the failure this service exists to
      # prevent and restarting the container would do nothing about it. Read the
      # body to see it; the status code is about the loop alone.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>{console.log('health '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable: '+(e.cause?.code||e.code||e.message));process.exit(1)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Badge Runner (kolonie-platform / apps/badge-runner) ===
  #
  # The sixth image and the fourth runner (kolonie-platform#241). It sweeps every
  # badge criterion on a timer and awards what has newly become true.
  #
  # **No Traefik route, no key, no secrets mount, and no `user:` override.** It
  # reads and writes Postgres and speaks to nothing else, so it is the one runner
  # that takes the image's own `USER node` unchanged — the argument the triage
  # runner has to make about uid 1000 does not arise where there is no file to
  # read. Port 3004 is exposed to the container runtime's health check alone.
  #
  # **It was built in kolonie-platform and deployed nowhere for three days**
  # (kolonie-infra#76). A compose service for an image that does not exist yet
  # makes `docker compose pull` fail for the whole `full` profile, so this entry
  # was deliberately withheld until the build job existed in the platform's
  # workflow. Both halves land together or neither does.
  badge-runner:
    image: ${BADGE_IMAGE:-ghcr.io/kolonie-ai/kolonie-badge-runner:PIN-NOT-SET-SEE-STATE-DEPLOYED-ENV}
    container_name: kolonie-badge-runner
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      BAN_MARK_SALT: ${BAN_MARK_SALT:?set BAN_MARK_SALT in .env — openssl rand -hex 32}
      # Six hours, and the slowness is the point: nothing waits on a badge. The
      # value is named here rather than left to the image's own default so that
      # reading this file answers how often it runs.
      #
      # The health check reports stalled after three intervals of silence, so
      # raising this also loosens how quickly a stopped loop is noticed.
      POLL_INTERVAL_MS: ${BADGE_POLL_INTERVAL_MS:-21600000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Same shape and same reason as the other three runners': `process.exit(0)`
      # reports healthy for a process wrapped around a dead polling loop (#11).
      #
      # **No queue depth here, unlike the triage runner.** This loop sweeps every
      # criterion every pass, so *how far behind* is not a question it can be
      # asked. The status code is about the loop alone.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then(r=>{console.log('health '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable: '+(e.cause?.code||e.code||e.message));process.exit(1)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Website (kolonie-website, static Astro build behind nginx) ===
  #
  # Its own profile, not `full`. The reason has changed and the arrangement has
  # not: the kolonie-website repository now exists and this image is published
  # and running, so the original argument — `docker compose pull` fails the whole
  # command when any one image is missing, taking api and verifier-runner down
  # with it — no longer applies.
  #
  # What keeps it separate now is blast radius. The website is the one service
  # whose failure costs nothing operational, and it is also the one that took the
  # whole stack down once (#11): it sat unhealthy for days while serving
  # perfectly, a deploy read that status, and the rollback stopped everything for
  # half an hour. A service that can be deployed on its own can also be left
  # alone on its own.
  #
  # `full` therefore means "the API and the two runners behind it". Deploy this one
  # with --profile website.
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/kolonie-ai/kolonie-website:PIN-NOT-SET-SEE-STATE-DEPLOYED-ENV}
    container_name: kolonie-website
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    healthcheck:
      # 127.0.0.1, never localhost. The image's /etc/hosts maps localhost to
      # both 127.0.0.1 and ::1; BusyBox wget tries ::1 first and nginx listens
      # on IPv4 only, so the check failed with "connection refused" while the
      # site served every request correctly. The container sat unhealthy for
      # days without anyone noticing — until a deploy read that status and
      # rolled the whole stack back. See kolonie-infra#11.
      test: ["CMD", "wget", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - website

  # === pgAdmin 4 — the maintainer's browser client for the database (#30) ===
  #
  # Reachable at db.kolonie.ai behind two locks: Traefik basicAuth in front, and
  # pgAdmin's own login behind it. Postgres itself gains no `ports:` mapping and
  # keeps none — pgAdmin reaches it as `postgres:5432` on the internal network,
  # which is the whole reason this is worth running instead of opening 5432.
  #
  # **Its own profile, not `full`, and that is the one place this deviates from
  # what #30 proposed.** `full` is what every kolonie-platform merge deploys, and
  # healthcheck() in scripts/deploy.sh rolls the whole stack back when any
  # service in the active profiles is unhealthy. So in `full`, an admin console
  # that failed to start would take the API down with it — for a container whose
  # failure costs nothing operational. That is the website's argument (see its
  # comment above) and it applies here with more force, because this service also
  # depends on two variables a human has to add to the host's .env out of band.
  # Between merging this file and that edit there is a window, and in `full` that
  # window is one where every deploy fails. #7 and #93 are both exactly that
  # shape, and both cost days.
  #
  # detect_profile() therefore adds `--profile admin` only once the host defines
  # PGADMIN_PASSWORD, so a host that has not been set up simply never sees this
  # service, and one that has gets it pulled, started and health-checked with
  # everything else.
  #
  # Pinned to a version, not `:latest`. Everything else here is pinned to a
  # digest by deploy.sh after the pull; this image is not one deploy.sh knows
  # about, so the pin has to be in the tag. `:latest` on a third party's image
  # means an upstream release can change what this host runs without any commit
  # here — which is #12's complaint, arriving from outside instead of inside.
  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:9.17}
    container_name: kolonie-pgadmin
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      # SERVER_MODE stays at the image's default of True, against the `False` in
      # #30's sketch. False is pgAdmin's desktop mode: it serves every request
      # without asking who is making it, and the second lock the issue's own
      # security posture asks for — "pgAdmin login, separate credentials" — would
      # then be a master-password prompt for stored server passwords rather than
      # a login. Behind basicAuth either is defensible; a real login is what the
      # acceptance criteria describe and the safer of the two to expose.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Neither is defaulted and neither is marked `:?`. Empty, the image's own
      # entrypoint refuses to start and says which variable it wanted, which is
      # the message worth having; `:?` would instead fail `docker compose` as a
      # whole, and this file is parsed on every deploy including the ones that
      # never activate this profile.
      #
      # pgAdmin writes its own SQLite config into the volume, so the login above
      # is read on *first* start only. Changing PGADMIN_PASSWORD later does not
      # change the account — reset it inside pgAdmin, or remove the volume.
      #
      # False follows from server mode. The master password exists to unlock
      # server passwords pgAdmin has stored; servers.json below stores none, so
      # requiring one adds a third prompt that guards an empty keyring. Two locks
      # is what #30 asked for and two is what this is.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # **Since #56 the header carries two entries, and this count still says
      # one.** That is deliberate for now, and it is the one thing to read before
      # changing a number here.
      #
      # `X-Forwarded-For` now arrives as `<client>, <cloudflare-edge>`: the
      # `websecure` entryPoint in traefik/traefik.yml trusts Cloudflare's
      # published ranges, so Traefik keeps the incoming header and appends to it
      # rather than discarding it. Until 2026-08-02 it arrived with exactly one
      # entry — the edge — and the paragraphs below were written against that.
      #
      # ProxyFix counts from the right, so a count of 1 still resolves to the
      # edge. What changed is that the client's address is now *present* in the
      # header, where before it existed only in `CF-Connecting-IP` — which
      # nothing here can be told to read. (apps/api/src/client-ip.ts in
      # kolonie-platform reads exactly that, which is why the API was unaffected
      # by any of this.)
      #
      # **Moving the count to 2 and putting `ENHANCED_COOKIE_PROTECTION` back on
      # is now possible and is a separate change**, wanting its own measurement
      # of what a session pins to. #56 made the correct answer available; it did
      # not make a naive configuration correct.
      #
      # **`ENHANCED_COOKIE_PROTECTION` is off, and that is the bug fix.** It
      # defaults on and pins a session to the address pgAdmin believes the client
      # has — here, a Cloudflare edge. Cloudflare answers from many, and a browser
      # opening parallel connections lands on several: one page load on
      # 2026-08-01 reported 104.23.199.178, 162.159.121.22, 104.23.199.250,
      # 104.23.199.160 and 104.23.199.207 as five different clients. Every
      # request therefore invalidated the session the one before it created, and
      # the login failed with **"The CSRF tokens do not match"** — a message that
      # names the symptom and points nowhere near the cause.
      #
      # Turning it off loses nothing, because it was never protecting anything:
      # a pin to an address that changes per request is not a defence, it is an
      # outage. Setting the count to 2 also "works", by running out of entries and
      # falling back to Traefik's own container address — stable, and a lie about
      # what the header contains. That was tried and rejected. Note that this
      # objection is the one #56 answered: with the ranges trusted, a count of 2
      # resolves to a real client rather than running off the end of the list.
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      # This host is reachable over https only — Traefik redirects `web` to
      # `websecure`. pgAdmin defaults this to False because it terminates plain
      # HTTP itself and cannot know that, so the cookie carrying an admin session
      # was not marked Secure. Saying so here costs nothing and closes the case
      # where a future misconfiguration serves the same cookie over plaintext.
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # The connection is registered for the operator rather than typed in by
      # hand, so "it can reach the database" is a property of this file instead
      # of a step somebody has to remember. Host, port and user only — pgAdmin
      # asks for the password at connect time, and POSTGRES_PASSWORD does not
      # belong in a tracked file.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /misc/ping is pgAdmin's own unauthenticated liveness endpoint, and the
      # check its container documentation recommends. 127.0.0.1 rather than
      # localhost, for the reason spelled out on the website service above.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Longer than anything else here on purpose: pgAdmin migrates its SQLite
      # config on first start and takes tens of seconds to answer. Judged too
      # early it looks like a failing container, and healthcheck() rolls the
      # stack back over a service that was merely slow.
      start_period: 60s
    profiles:
      - admin

  # === Loki — the queryable log store (#68) ===
  #
  # One place every container's logs land, askable over HTTP by any agent that
  # holds the token. Single-binary, filesystem storage, no object store, no
  # Grafana. The configuration and the reasoning behind each number are in
  # loki/loki.yml; what belongs here is what compose decides.
  #
  # **Retention is 30 days and the ingestion ceiling is 4 MB/s** (loki.yml,
  # `limits_config`). Measured on this host 2026-08-04: about 3.5 MB of log a day
  # across all eight containers, so thirty days is roughly 100 MB before
  # compression. The root filesystem is 96 GB with 56 GB free — #68 was written
  # against 20 GB, which is what it was before the disk was grown, and the
  # numbers here are chosen against the measurement rather than that sentence.
  # Loki has no bytes-on-disk quota; the rate ceiling times the window is what
  # bounds it, and 4 MB/s exists to stop a crash-looping container rather than to
  # budget the ordinary case. #37 is the incident where logs took the host down.
  #
  # **No `profiles:`, so it is infrastructure like Traefik and Postgres.** The
  # pgAdmin service below is gated on a host variable because its container
  # refuses to start without one, and a service that cannot start turns every
  # kolonie-platform deploy into a rollback. Nothing here needs a host variable:
  # the image is third-party and always pullable, the configuration is a mounted
  # file, and the credential lives in Traefik. So there is no window of the #7 or
  # #93 shape to gate against.
  #
  # **Loki's own logs go to Docker's json-file driver, not to Loki.** They arrive
  # there anyway through Promtail, which is fine and not the point — the point is
  # that the record of Loki failing must not depend on Loki. `docker logs
  # kolonie-loki` answers when the store is the thing that is broken.
  #
  # **It is not the answer to "is the host alive".** It lives on the box it
  # observes, so if the box goes the evidence goes with it. That question is
  # kolonie-infra#69, and ARCHITECTURE.md records the split.
  #
  # Pinned to a version rather than `:latest`, for the reason pgAdmin's comment
  # spells out: deploy.sh pins the images it knows about to a digest, and this is
  # not one of them, so the pin has to be in the tag.
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.6.13}
    container_name: kolonie-loki
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    # No `ports:`. Loki is reached from inside the network by Promtail and from
    # outside through Traefik's authenticated route only — publishing 3100 on the
    # host would put an unauthenticated read of every service's logs on the
    # origin address, behind nothing.
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    # **No healthcheck, and this is a measured limitation rather than an
    # oversight.** grafana/loki:3.6.13 is a distroless image: its entire
    # filesystem contains `/usr/bin/loki` and no shell, no wget and no curl
    # (verified by exporting the image on 2026-08-04). A Docker healthcheck runs
    # *inside* the container, so there is nothing available to ask `/ready` with.
    # The two ways round it are both worse than the gap: baking a custom image
    # adds a build step this repository does not have, and bind-mounting a static
    # binary from the host puts the check in host state nothing here can see,
    # which is what #42 is about.
    #
    # What covers it instead, and it is more than it sounds:
    #   - `scripts/health-triage.sh` judges a container by its *state* first and
    #     its health second, so a Loki that has stopped is reported `gone` or
    #     `exited` by Health Watch exactly like any other service. Health `none`
    #     on a running container is treated as fine, which is the correct reading
    #     here.
    #   - the Diagnose VPS workflow lists it — with `docker ps -a` since this
    #     issue, because a container reported by its absence is one nobody sees.
    #   - Traefik reports the route as down.
    #   - kolonie-docs#133's silent-service check notices when lines stop
    #     arriving at all, which is the failure that actually matters.
    #
    # There is a second, deliberate effect. healthcheck() in scripts/deploy.sh
    # rolls the **whole stack** back when any service in the active profiles is
    # unhealthy — so a container with no health check cannot take the Colony down
    # over its log store. For this service that is the right trade.

  # === Promtail — the shipper (#68) ===
  #
  # Reads Docker's json-file logs off disk and pushes them to Loki. The pipeline,
  # the label set and the cardinality rule are in promtail/promtail.yml.
  #
  # **`/var/lib/docker/containers:ro`, and never `/var/run/docker.sock`.** The
  # socket is root on the host for whoever holds it; the files carry the same
  # lines, and since `x-logging` above names `com.docker.compose.service` they
  # carry the service name too. This is a review checklist item: a change that
  # adds the socket mount here is rejected on sight.
  #
  # Deprecation, stated because it will not announce itself: Grafana has put
  # Promtail into maintenance in favour of Alloy. It is not urgent — the agent
  # does one thing and the format it pushes is Loki's stable API — but it is the
  # reason to expect a follow-up issue rather than a surprise.
  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.6.11}
    container_name: kolonie-promtail
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/promtail
    depends_on:
      - loki
    healthcheck:
      # Promtail's image is Debian-based and has bash but no wget and no curl, so
      # the check speaks HTTP through bash's own /dev/tcp rather than through a
      # tool that is not there. It asks Promtail's `/ready`, which is true once
      # its targets are attached — i.e. it is actually tailing files.
      #
      # It deliberately does **not** ask Loki's `/ready` as well, although from
      # here it could. deploy.sh rolls the whole stack back on an unhealthy
      # service, so checking Loki from here would let the log store take a
      # kolonie-platform deploy down — a monitor larger than the thing it
      # monitors, which is the failure this whole programme exists to catch. A
      # Loki that is down is a Promtail that buffers and retries, and that is not
      # an outage.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9080; printf "GET /ready HTTP/1.0\r\n\r\n" >&3; grep -qm1 "200 OK" <&3']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
