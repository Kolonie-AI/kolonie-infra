name: Health Watch

# Notices a container that is unhealthy but still serving (#11).
#
# On 2026-07-28 kolonie-website was unhealthy for an unknown number of days while
# answering every request correctly. Nothing reported it. It surfaced when a
# docs-only push triggered a deploy, the deploy read the health status, and the
# rollback took the site down for half an hour. The wrong status was cheap to fix
# — 127.0.0.1 instead of localhost — and expensive to discover late, because
# everything downstream treats it as truth.
#
# The gap was not that the stack had no health checks. It was that the only
# reader of them ran at deploy time. This workflow is a second reader that runs
# whether or not anyone deploys.
#
# **Where the notification goes: a GitHub issue.** AGENTS.md §3 in kolonie-docs
# says every open task is an issue and no task lives anywhere else, so that is
# where this project actually looks. A Slack webhook or an emailed alert would be
# a second place to look that nobody has agreed to look at, and it would not
# survive the maintainer being replaced by another agent — which is the property
# the whole process is built around.

on:
  schedule:
    # Every fifteen minutes. GitHub delays scheduled runs under load and drops
    # them outright sometimes, so this is a floor on latency and not a promise:
    # the thing being caught sat broken for days, and catching it within the hour
    # is the whole win. Do not tighten this in the hope of precision it cannot
    # give.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A second run starting while one is mid-way through filing an issue would
# duplicate it. Queue rather than cancel — a cancelled run reports nothing, and
# silence is the failure mode this workflow exists to end.
concurrency:
  group: health-watch
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  DEPLOY_DIR: /opt/kolonie
  ISSUE_TITLE: 'Containers on the deploy host are unhealthy'
  DRIFT_ISSUE_TITLE: 'The deploy host is not serving what was last built'
  # Deliberately not a variant of the line above. That one means *a build exists
  # that this host has not taken*; this one means *the host is running something
  # its own record does not name*, which is the failure that hid on 2026-08-06
  # precisely because the two read alike (#89).
  PIN_ISSUE_TITLE: 'The deploy host is not running the images its own record names'
  # The one report that is about this workflow rather than about the host (#104).
  # It is deliberately not phrased as a host fault: what it says is that the
  # other three reports stopped being evidence, which is a claim about the
  # watcher and reads wrongly as anything else.
  SELF_ISSUE_TITLE: 'Health Watch is not watching: a run failed part-way through'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plain ssh rather than appleboy/ssh-action, which the rest of this
      # repository uses.
      #
      # That action runs a command perfectly well and **does not hand back what
      # it printed**: `steps.<id>.outputs.stdout` came through empty, so the
      # report never reached the triage step. Every other workflow here only
      # needs the remote command's *exit status*, which is why nothing had
      # noticed. This one needs its output, so it does the connection itself.
      #
      # Worth keeping as the reason not to "simplify" this back later.
      - name: Read what each container thinks of itself
        id: probe
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The host is a secret, so it cannot be pinned in a known_hosts file
          # committed here. Accepting the key on first use is what every other
          # workflow in this repository already does through the action; making
          # it explicit does not weaken anything, and the runner is fresh each
          # time so there is no key to have changed under us.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "cd ${DEPLOY_DIR} && chmod +x scripts/health-report.sh && ./scripts/health-report.sh" \
              > probe.out

          # Why each unhealthy container says so, collected in the same session
          # and *before* anything acts on the verdict. `.State.Health.Log` keeps
          # only the last five attempts however long the container has been
          # failing, so a reason not taken now is a reason gone — the same
          # property that made #43 necessary one level down.
          #
          # It prints nothing when every container is healthy.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "cd ${DEPLOY_DIR} && chmod +x scripts/health-why.sh && ./scripts/health-why.sh" \
              > why.out || true

          # A second question over the same connection: which commit is each
          # container running (#44). Separate from the health report because it
          # is a separate condition — a host can be entirely healthy and a build
          # behind, which is the silence #31 left open, and merging the two rows
          # into one report would mean one verdict for two unrelated faults.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "cd ${DEPLOY_DIR} && chmod +x scripts/deployed-revision.sh && ./scripts/deployed-revision.sh" \
              > revisions.out

          # A third question, and it is not the second one asked twice (#89).
          #
          # `deployed-revision.sh` feeds a comparison against **the newest image
          # built**, which is blind in exactly one case: when the *build* is what
          # failed, nothing newer is ever pushed, so the host matches the newest
          # image that exists and the check answers `current` while serving
          # week-old code. That is what happened on 2026-08-06.
          #
          # This compares against **the record** — `state/deployed.env` — which
          # moves only when a deploy succeeds. One notices a build nobody took;
          # the other notices a container nobody meant to start.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "cd ${DEPLOY_DIR} && chmod +x scripts/pin-report.sh && ./scripts/pin-report.sh" \
              > pins.out

          # Never leave a production key on the filesystem past the step that
          # needed it, even on a runner that is about to be destroyed.
          shred -u ~/.ssh/deploy_key

          echo "health rows: $(wc -l < probe.out)"
          echo "reason lines: $(wc -l < why.out)"
          echo "revision rows: $(wc -l < revisions.out)"
          echo "pin rows: $(wc -l < pins.out)"

      - name: Triage the report
        id: triage
        run: |
          set -uo pipefail
          cp probe.out report.tsv

          if [ ! -s report.tsv ]; then
            # The probe produced nothing between the markers. That is not a
            # healthy stack — it is a broken watcher, and reporting it as "ok"
            # is precisely how this failure hides. Fail the run so it is visible
            # in the Actions tab rather than filing a reassuring issue comment.
            echo "::error::The health probe returned no rows. SSH reachable but the report is empty?"
            exit 1
          fi

          chmod +x scripts/health-triage.sh
          ./scripts/health-triage.sh < report.tsv > summary.md 2> verdict.env || true
          cat verdict.env >> "$GITHUB_OUTPUT"

          {
            echo 'summary<<KOLONIE_EOF'
            cat summary.md
            echo 'KOLONIE_EOF'
          } >> "$GITHUB_OUTPUT"

          cat summary.md

      - name: File, update or close the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.triage.outputs.VERDICT }}
          FINGERPRINT: ${{ steps.triage.outputs.FINGERPRINT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$ISSUE_TITLE\"" --json number,body --limit 1)"
          number="$(echo "$existing" | jq -r '.[0].number // empty')"

          if [ "$VERDICT" = "ok" ]; then
            # Nothing wrong. The only thing that may happen is closing a report
            # that is no longer true — and if there is none, this job says
            # nothing at all. A healthy stack producing a comment every fifteen
            # minutes is how an alert channel gets muted.
            if [ -n "$number" ]; then
              printf '%s\n\n%s\n' \
                'Recovered. Every container is running and none reports itself unhealthy.' \
                "$RUN_URL" > recovered.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file recovered.md
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --reason completed --comment "Closed automatically by Health Watch."
              echo "closed #$number"
            else
              echo "healthy, nothing open — saying nothing"
            fi
            exit 0
          fi

          # Written to a file rather than built as a shell string. A multi-line
          # literal inside a `run: |` block has to stay indented or it ends the
          # YAML scalar, and the failure is a parse error in a workflow nobody
          # can run — the fingerprint marker below is exactly the kind of line
          # that starts at column zero.
          {
            cat summary.md
            # The container's own account of it. Empty when the fault is a late
            # backup or a filling disk rather than a container, which is why it
            # is concatenated rather than announced.
            cat why.out
            printf '\n<!-- health-watch-fingerprint: %s -->\n\n' "$FINGERPRINT"
            printf 'Filed automatically by [Health Watch](%s). It closes itself when the host\n' "$RUN_URL"
            printf 'reports every container healthy again — do not close it by hand while the\n'
            printf 'condition holds, or the next run will simply file it again.\n\n'
            printf 'Read this as a task with the cause open: a health check is as likely to be\n'
            printf 'wrong as the service is to be down. In #11 the service was entirely fine and\n'
            printf 'the check was looking at the wrong address family.\n'
          } > body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --label bug --label p1 --label area:infra \
              --body-file body.md
            echo "filed a new report"
            exit 0
          fi

          previous="$(echo "$existing" | jq -r '.[0].body // ""' \
            | sed -n 's/.*health-watch-fingerprint: \(.*\) -->.*/\1/p')"

          if [ "$previous" = "$FINGERPRINT" ]; then
            # Same containers broken the same way as last run. The open issue
            # already says so, and repeating it every fifteen minutes would bury
            # the change that matters under a hundred identical comments.
            echo "unchanged since the last run — #$number already says this"
            exit 0
          fi

          {
            printf 'What is wrong has changed.\n\n'
            cat summary.md
            cat why.out
            printf '\n%s\n' "$RUN_URL"
          } > changed.md

          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file changed.md
          echo "updated #$number"

      # --- deploy drift (#44) ---------------------------------------------
      #
      # A separate condition, a separate issue and a separate verdict. #31 made
      # one commit produce one deploy, which was the mechanism; this is the
      # measurement, and it is what notices the ways a host falls behind that no
      # queue can prevent — a deploy that failed and rolled back, a cancelled
      # run, a manual intervention, an image that never built.
      #
      # It runs whatever the health verdict was. A host is perfectly capable of
      # being green and a build behind, and that combination is the one that
      # stays hidden longest.
      - name: Compare what is running against what was last built
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          chmod +x scripts/drift-triage.sh

          # **`|| status=$?` and not a bare call.** The step runs under
          # `bash -e`, which GitHub sets on the interpreter — `set -uo pipefail`
          # above does not unset it, and omitting `-e` from a `set` line never
          # could. A bare call therefore ends the step the moment the script
          # exits non-zero, and `status=$?` on the next line never runs.
          #
          # That is the whole of `#104`. `drift-triage.sh` reports drift *by*
          # exiting 1 — its own header says so, and `rehearse-drift.sh` asserts
          # it — so from 2026-08-09 08:02, the first moment the host actually
          # drifted, this step died at exactly the point it had something to
          # say. Everything below it was skipped, including the step that files
          # the report, and two of this workflow's three watchers went quiet for
          # a day while it went on reporting the third as green.
          status=0
          ./scripts/drift-triage.sh < revisions.out > drift.md 2> drift-verdict.env || status=$?

          # 0 is current and 1 is drifted; both are answers, and this step
          # succeeds for either. Exit 2 is the script saying it could not run —
          # an empty probe rather than a behind host. Fail the run so it is
          # visible in the Actions tab, for the same reason the health triage
          # does: a broken watcher that reports "ok" is the failure this
          # workflow exists to end.
          if [ "$status" -eq 2 ]; then
            echo "::error::The revision probe returned no rows. SSH reachable but the report is empty?"
            exit 1
          fi

          cat drift-verdict.env >> "$GITHUB_OUTPUT"
          cat drift.md

      - name: File, update or close the drift report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.drift.outputs.VERDICT }}
          FINGERPRINT: ${{ steps.drift.outputs.FINGERPRINT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$DRIFT_ISSUE_TITLE\"" --json number,body --limit 1)"
          number="$(echo "$existing" | jq -r '.[0].number // empty')"

          # `unknown` files nothing. It means this check is partly blind — an
          # image from before kolonie-platform#75, or a revision GHCR no longer
          # lists — and an issue that says "I cannot tell" every fifteen minutes
          # teaches the reader to ignore the ones that say something.
          if [ "$VERDICT" != "drifted" ]; then
            if [ -n "$number" ]; then
              printf '%s\n\n%s\n' \
                'Resolved. Every service is running the newest image built for it.' \
                "$RUN_URL" > drift-recovered.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file drift-recovered.md
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --reason completed --comment "Closed automatically by Health Watch."
              echo "closed #$number"
            else
              echo "verdict $VERDICT, nothing open — saying nothing"
            fi
            exit 0
          fi

          {
            cat drift.md
            printf '\n<!-- drift-watch-fingerprint: %s -->\n\n' "$FINGERPRINT"
            printf 'Filed automatically by [Health Watch](%s). It closes itself once every\n' "$RUN_URL"
            printf 'service is running the newest image built for it.\n\n'
            printf 'A green stack and a behind host are compatible states, so do not read this\n'
            printf 'as an outage. Read it as: a build exists that this host is not running, and\n'
            printf 'something decided that without saying so.\n'
          } > drift-body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$DRIFT_ISSUE_TITLE" \
              --label p1 --label area:infra \
              --body-file drift-body.md
            echo "filed a new drift report"
            exit 0
          fi

          previous="$(echo "$existing" | jq -r '.[0].body // ""' \
            | sed -n 's/.*drift-watch-fingerprint: \(.*\) -->.*/\1/p')"

          if [ "$previous" = "$FINGERPRINT" ]; then
            echo "unchanged since the last run — #$number already says this"
            exit 0
          fi

          {
            printf 'What is behind has changed.\n\n'
            cat drift.md
            printf '\n%s\n' "$RUN_URL"
          } > drift-changed.md

          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file drift-body.md
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file drift-changed.md
          echo "updated #$number"

      # --- pin drift (#89) -------------------------------------------------
      #
      # A third condition, a third issue and a third verdict, for the same
      # reason the drift lane is separate from the health lane: one verdict for
      # two unrelated faults is a report nobody can act on.
      #
      # What this one catches that neither of the others can: a container
      # running an image `state/deployed.env` does not name. On 2026-08-06 that
      # was production on an api two days and 212 commits behind — healthy,
      # serving, and reported as current by every instrument the host had,
      # because the health check passes on old code and the drift check's
      # reference had moved backwards with it.
      - name: Compare what is running against what the record names
        id: pins
        run: |
          set -uo pipefail

          chmod +x scripts/pin-triage.sh

          # `|| status=$?` for the reason the drift step above spells out. This
          # step carried the identical defect and had never shown it, because
          # the drift step dies first and this one is skipped — so `#104` found
          # one broken watcher and there were two.
          status=0
          ./scripts/pin-triage.sh < pins.out > pins.md 2> pins-verdict.env || status=$?

          # 0 and 1 are both answers. Exit 2 is the script saying it could not
          # run — an empty probe rather than a disagreeing host. Fail the run so
          # it is visible in the Actions tab, for the same reason the other two
          # triages do.
          if [ "$status" -eq 2 ]; then
            echo "::error::The pin probe returned no rows. SSH reachable but the report is empty?"
            exit 1
          fi

          cat pins-verdict.env >> "$GITHUB_OUTPUT"
          cat pins.md

      - name: File, update or close the pin report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.pins.outputs.VERDICT }}
          FINGERPRINT: ${{ steps.pins.outputs.FINGERPRINT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$PIN_ISSUE_TITLE\"" --json number,body --limit 1)"
          number="$(echo "$existing" | jq -r '.[0].number // empty')"

          # `unknown` files nothing, exactly as the drift lane decided. It means
          # this check is partly blind — a host with no completed pinned deploy,
          # or a recorded image the local store no longer holds — and an issue
          # that says "I cannot tell" every fifteen minutes teaches the reader to
          # ignore the ones that say something.
          if [ "$VERDICT" != "drifted" ]; then
            if [ -n "$number" ]; then
              printf '%s\n\n%s\n' \
                'Resolved. Every running container matches the image `state/deployed.env` names.' \
                "$RUN_URL" > pins-recovered.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file pins-recovered.md
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --reason completed --comment "Closed automatically by Health Watch."
              echo "closed #$number"
            else
              echo "verdict $VERDICT, nothing open — saying nothing"
            fi
            exit 0
          fi

          {
            cat pins.md
            printf '\n<!-- pin-watch-fingerprint: %s -->\n\n' "$FINGERPRINT"
            printf 'Filed automatically by [Health Watch](%s). It closes itself once every\n' "$RUN_URL"
            printf 'container matches the record again.\n\n'
            printf 'Read this as: something started a container without the pins, and the file\n'
            printf 'the rest of this system trusts has been wrong ever since. A healthy stack\n'
            printf 'and a green drift check are both compatible with it — an older build is\n'
            printf 'healthy, and when a build fails there is no newer image to be behind.\n'
          } > pins-body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$PIN_ISSUE_TITLE" \
              --label p1 --label area:infra \
              --body-file pins-body.md
            echo "filed a new pin report"
            exit 0
          fi

          previous="$(echo "$existing" | jq -r '.[0].body // ""' \
            | sed -n 's/.*pin-watch-fingerprint: \(.*\) -->.*/\1/p')"

          if [ "$previous" = "$FINGERPRINT" ]; then
            echo "unchanged since the last run — #$number already says this"
            exit 0
          fi

          {
            printf 'What disagrees has changed.\n\n'
            cat pins.md
            printf '\n%s\n' "$RUN_URL"
          } > pins-changed.md

          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file pins-body.md
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file pins-changed.md
          echo "updated #$number"

      # --- the watcher watching itself --------------------------------------
      #
      # **A partly-failing monitor is quieter than a fully-failing one** (#104).
      # On 2026-08-09 the drift step died at 08:02 and every step after it was
      # skipped. The health step kept succeeding, kept its issue up to date and
      # kept reading as a working watcher — so two of the three things this
      # workflow watches went unwatched for a day and the only trace was a red
      # tick in a tab nobody opens. It was found by looking, while answering an
      # unrelated question.
      #
      # The steps above report what they *find*. This reports that they did not
      # get to look, which is a different fact and was the one with no channel.
      #
      # **One issue, opened once and closed on the next clean run**, matching
      # the three reports above rather than inventing a fourth idiom. It carries
      # `p1` because a watcher that is not watching invalidates the silence of
      # every other watcher — reading *no open issue* as *nothing is wrong* is
      # exactly what this failure made untrue.
      #
      # `if: failure()` and not `always()`: a run that succeeded has nothing to
      # say here, and the close below is what turns the issue off.
      - name: Say so when this watcher could not do its job
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$SELF_ISSUE_TITLE\"" --json number --limit 1)"
          number="$(echo "$existing" | jq -r '.[0].number // empty')"

          {
            printf 'A Health Watch run failed part-way through, so some of what this\n'
            printf 'workflow watches was not watched.\n\n'
            printf '**Read the silence of the other reports with that in mind.** They report\n'
            printf 'what a step found; a step that did not run finds nothing, and an issue\n'
            printf 'that stays closed is then not evidence of a healthy host.\n\n'
            printf 'Which step failed, and the log: %s\n\n' "$RUN_URL"
            printf 'This closes itself on the next run that gets all the way through.\n'
          } > self-body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$SELF_ISSUE_TITLE" \
              --label p1 --label area:infra \
              --body-file self-body.md
            echo "filed a new watcher report"
            exit 0
          fi

          # **The body is rewritten rather than appended to**, so the issue
          # always names the newest failing run. A comment per failed run, every
          # fifteen minutes, is how a p1 issue becomes something people mute.
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file self-body.md
          echo "updated #$number — still failing"

      # Closed only from a run that reached the end, which is what makes the
      # issue's absence mean something.
      - name: Close the watcher report once a run gets through
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$SELF_ISSUE_TITLE\"" --json number --limit 1)"
          number="$(echo "$existing" | jq -r '.[0].number // empty')"

          if [ -z "$number" ]; then
            echo "nothing open — saying nothing"
            exit 0
          fi

          printf 'Resolved. A run reached the end, so every step reported.\n\n%s\n' "$RUN_URL" \
            > self-recovered.md
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file self-recovered.md
          gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
            --reason completed --comment "Closed automatically by Health Watch."
          echo "closed #$number"
