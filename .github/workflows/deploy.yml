name: Deploy to VPS

# Three ways in, and they answer three different questions.
#
# `workflow_call` is the one that matters: the image builds in kolonie-platform
# call it after pushing, so a merge there ends with that exact build running here
# (#14). Before it existed, production redeployed when the infrastructure
# *configuration* changed and did not redeploy when the *code* changed — the
# trigger sat on the wrong repository, and `operations/deployment.md` in
# kolonie-docs documented a chain that was never connected.
#
# `push` is this repository's own changes, and since #13 it is filtered: a deploy
# should happen when something that affects the running system changes, not when
# a Markdown file does. `paths-ignore` rather than `paths`, deliberately — a
# filter that lists what *does* deploy silently stops deploying anything added
# later, and a change that is not deployed is far harder to notice than one that
# is. So: everything deploys except what provably cannot change what a container
# does.
#
# `workflow_dispatch` always deploys, whatever the paths say. It is the escape
# hatch, and it is also how the host is brought back in line if a filter turns
# out to have been too clever.
on:
  workflow_call:
    inputs:
      service:
        description: >-
          What to deploy: `all`, one service, or a comma-separated list of them
          (api, verifier-runner, moderation-runner, website). A list is deployed
          in one run, in dependency order, which is what stops a fan-out from
          becoming several deploys racing for one concurrency group — #31.
        type: string
        required: false
        default: 'all'
      version:
        description: >-
          Image tag to deploy, applied to every service named above. A caller
          that knows which build it just pushed passes that build, and then what
          runs is a function of a commit rather than of whatever happens to be
          sitting in :latest by the time the pull runs. Leave it empty to
          re-deploy the builds already recorded in state/deployed.env — deploy.sh
          refuses `latest` outright, so an empty version is the only way to say
          "whatever is serving now".
        type: string
        required: false
        default: ''
    # Named rather than inherited. `secrets: inherit` would hand this workflow —
    # which lives in another repository and can SSH into production — every
    # secret the calling repository holds, for the two it actually needs. Listing
    # them also makes the requirement readable from the caller's side: a
    # repository that cannot supply these cannot deploy, and finds that out at
    # the call rather than at the SSH step.
    secrets:
      VPS_HOST:
        required: true
      VPS_SSH_KEY:
        required: true
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'state/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      service:
        description: 'all, one service, or a comma-separated list (api, verifier-runner, moderation-runner, website)'
        required: false
        default: 'all'
      version:
        description: 'Image tag, applied to every service named above. Empty re-deploys what state/deployed.env records; `latest` is refused.'
        required: false
        default: ''

# One deploy at a time, and a queued one waits rather than replacing the one in
# flight. Two SSH sessions running deploy.sh against one host would interleave a
# pull, a migration and an `up -d` with neither knowing the other exists.
# `cancel-in-progress: false` because cancelling a deploy mid-migration is the
# one outcome worse than deploying twice.
#
# **This is half a defence, and #31 is the other half.** GitHub allows exactly
# one *pending* run per group, so a third arrival evicts the one already waiting.
# While kolonie-platform fanned one commit out into three deploys, that was not a
# rare interleaving — it was every push touching packages/core or packages/db,
# and it always cost the middle arrival. Measured over five occurrences on
# 2026-07-30: the api lost three times in a row, because it is the largest image
# and therefore reliably queues second. It is also the only image carrying
# migrate() and the Academy seed.
#
# The fix is upstream: one commit now produces **one** call to this workflow,
# naming every service that changed (see the `service` input). The queue is not
# made deeper — the thing that filled it stopped. This group still protects
# against two *commits* landing inside one deploy window, which is what it was
# always for.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # packages: read lets GITHUB_TOKEN pull the application images from GHCR.
    # From a push here that needs this repository's grant on those packages
    # (#1). When kolonie-platform calls this workflow the token is that
    # repository's, and it owns the packages — so a called deploy does not
    # depend on the grant at all.
    permissions:
      contents: read
      packages: read

    env:
      # Organisation secrets since #14, visible to this repository and to
      # kolonie-platform. The rejected alternative was a fine-grained PAT in
      # kolonie-platform plus `repository_dispatch`: it works anywhere, and it
      # costs an additional long-lived token whose entire power is *deploy
      # production*, with an expiry and a rotation nobody will remember.
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ubuntu
      DEPLOY_DIR: /opt/kolonie
      # `inputs` is empty on a push, so this deploys everything at whatever
      # state/deployed.env already records — which is what a change to *this*
      # repository means: the infrastructure config moved, the application
      # builds did not.
      #
      # An empty VERSION rather than `latest`. deploy.sh refuses `latest` outright
      # since PR #41 — a deploy that pulls the mutable tag ships whatever finished
      # building most recently, which need not be the commit that asked for it and
      # need not be a commit anyone reviewed. Empty means "keep serving the builds
      # you have recorded", which is a statement about a known digest; `latest` is
      # a statement about a moment in time.
      SERVICE: ${{ inputs.service || 'all' }}
      VERSION: ${{ inputs.version || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Say what is being deployed, before anything moves
        run: |
          echo "service: $SERVICE"
          echo "version: $VERSION"
          echo "trigger: ${{ github.event_name }} from ${{ github.repository }}@${{ github.sha }}"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          # Expires with this job. Nothing long-lived is stored on the host.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # SERVICE and VERSION travel as environment variables rather than
          # being interpolated into the script body. An input is untrusted text,
          # and text pasted into a shell by a templating engine is a shell
          # injection with extra steps.
          envs: GHCR_TOKEN,GHCR_USER,SERVICE,VERSION
          script: |
            # Without this the script runs on: a failing command is logged and
            # the next one runs anyway, and the step's status is whatever the
            # *last* command returned. That is how a deploy shipped stale
            # infrastructure config and reported success — see the git step
            # below for the failure that exposed it.
            set -euo pipefail

            cd ${{ env.DEPLOY_DIR }}

            # `reset --hard`, not `git pull`. The host is a mirror of origin, not
            # a working copy with opinions: it has no commits of its own to
            # preserve, and merging is never the right answer here.
            #
            # `git pull` failed outright once the history of this repository was
            # rewritten — "fatal: Need to specify how to reconcile divergent
            # branches" — and because the script did not stop on error, three
            # deploys ran against config frozen at the pre-rewrite commit and
            # reported green. Fetch-and-reset cannot diverge, so a rewrite, a
            # force-push or accidental local drift all resolve the same way.
            git fetch origin main
            git reset --hard origin/main

            # Only the scripts that are missing the bit, because `chmod` on a
            # file owned by another user is EPERM *even when the mode already
            # matches* — and this line runs under `set -e`, before deploy.sh.
            #
            # That is not hypothetical. Someone ran `sudo git reset --hard` in
            # this directory on 2026-08-10 while repairing a token in `.env`;
            # git rewrote one changed file, root owned it afterwards, and the
            # next twenty deploys died here without reaching a single service.
            # Production served a twenty-hour-old build and every run reported
            # only "Deployment failed! Check VPS logs."
            #
            # The exec bit is carried in the tree, so the reset above has already
            # set it and this loop normally does nothing. A script that genuinely
            # is not executable still fails the deploy, loudly, which is what the
            # line was for.
            for script in scripts/*.sh; do
              [ -x "$script" ] || chmod +x "$script"
            done

            # A list is deployed as a sequence of single-service deploys in one
            # session, not as a new mode inside deploy.sh (#31).
            #
            # Two reasons it is a loop here rather than a rewrite there.
            # deploy.sh's rollback and its cascade marker are written per
            # service, and the whole value of that machinery is that a service
            # that fails returns to the build it was serving while the others do
            # not. And the script is the most dangerous file in this repository:
            # a queue defect is not a reason to reopen its migration ordering.
            #
            # What changes is that the sequence is now *one* run, so there is no
            # second queue entry for a third arrival to evict.
            #
            # `all` and a single name behave exactly as before. The ordering and
            # the rejection of an unknown name live in scripts/deploy-set.sh,
            # where a rehearsal can reach them — the api must go first, and that
            # is a policy with a wrong answer, not a formatting detail.
            ORDERED=$(./scripts/deploy-set.sh "$SERVICE")

            echo "deploying in order: $(echo "$ORDERED" | tr '\n' ' ')"

            for svc in $ORDERED; do
              echo "--- deploy.sh $svc ---"

              # The version applies to the service being deployed and to nothing
              # else. Deploying "all" at one tag would have to assume the five
              # images share a version, and they do not — they are built by five
              # workflows in two repositories. Within one list they *do* share
              # one, because a list only ever comes from one commit's builds.
              #
              # **A service missing from this case is a service that cannot be
              # deployed for the first time**, and it fails somewhere that does
              # not mention this file. `support-triage-runner` shipped without its
              # line on 2026-08-01: `deploy.sh` resolved every image, found no
              # version named and nothing recorded for the new one, and refused —
              # correctly, and with a message about `deployed.env` that sends the
              # reader to the host rather than here. The rehearsal did not catch
              # it either, because it drives `deploy.sh` with the variables this
              # block is what sets. Adding a service means adding it here, in
              # `deploy-set.sh`'s ORDER, and in `deploy.sh` — all three.
              (
                case "$svc" in
                  api)                   export API_VERSION="$VERSION" ;;
                  verifier-runner)       export RUNNER_VERSION="$VERSION" ;;
                  moderation-runner)     export MODERATION_VERSION="$VERSION" ;;
                  support-triage-runner) export TRIAGE_VERSION="$VERSION" ;;
                  badge-runner)          export BADGE_VERSION="$VERSION" ;;
                  doctor-runner)         export DOCTOR_VERSION="$VERSION" ;;
                  website)               export WEBSITE_VERSION="$VERSION" ;;
                  # `all` is not a service and takes no version, which is what
                  # the paragraph above already argues: five images built by five
                  # workflows in two repositories share no tag, so there is no
                  # single version to apply. `deploy.sh all` resolves each image
                  # from what the host has recorded, which is exactly right for a
                  # change to compose or to the environment — the images do not
                  # move.
                  #
                  # **It was missing, and that made every `all` deploy fail.**
                  # `deploy-set.sh` deliberately passes `all` through rather than
                  # expanding it — that is `deploy.sh`'s whole-project mode, one
                  # pull and one `--remove-orphans`, and its own comment says
                  # expanding it here would be worse. So the loop always runs once
                  # with `all`, always reached this `*)` branch, and always
                  # exited 1. Nothing caught it because every deploy since had
                  # named a service; the first push that changed
                  # `docker-compose.yml` found it (2026-08-01), after the host had
                  # already fetched the commit but before anything was recreated.
                  all)                   ;;
                  # deploy-set.sh accepted this name and this file has no
                  # mapping for it, so the two have drifted. Said here, where the
                  # fix is, rather than left to surface as deploy.sh refusing an
                  # image for want of a version nobody passed it.
                  *) echo "::error::deploy.yml has no version mapping for '$svc' — add one beside the others"; exit 1 ;;
                esac

                ./scripts/deploy.sh "$svc"
              )
            done

            # `set -e` is what makes the ordering load-bearing rather than
            # decorative: if the api deploy fails and rolls back, the loop stops
            # and the runners are never started against a schema that did not
            # move. Deploying them anyway is the failure this ordering exists to
            # prevent, so failing early is the correct outcome, not a limitation.

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_DIR }}
            ./scripts/healthcheck.sh

      # Reports whether the host still matches the Security section of
      # ARCHITECTURE.md (#3). It is `continue-on-error` on purpose: hardening
      # drift is worth seeing on every deploy, and it is never worth blocking
      # one. The deploy is also how an operator fixes a broken host, so a step
      # that failed the run on a drifted firewall would take the repair path
      # away at exactly the moment it is needed.
      #
      # It prints usernames and service states and no addresses, so it is safe
      # in a public workflow log — see AGENTS.md §11.
      - name: Verify host hardening
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_DIR }}
            sudo ./scripts/host-hardening.sh verify

      # **This is an annotation, not an alarm, and #124 is the difference.** It
      # puts the reason at the top of a run somebody has already opened. Nothing
      # about it reaches a reader who has not, which is why twenty consecutive
      # failures went unnoticed for twenty hours with this line present and
      # working every time.
      #
      # `deploy-alarm.yml` is the alarm. It watches this workflow's runs *and*
      # `build-and-deploy.yml`'s in kolonie-platform, because a `workflow_call`
      # run belongs to the caller and is invisible from here.
      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment failed! Check VPS logs. Deploy Alarm files an issue if the next one fails too (#124)."
