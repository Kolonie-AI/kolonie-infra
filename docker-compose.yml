networks:
  kolonie:
    name: kolonie
    driver: bridge

volumes:
  postgres_data:
  traefik_certs:

services:
  # === Traefik Reverse Proxy ===
  traefik:
    image: traefik:v3.7
    container_name: kolonie-traefik
    restart: unless-stopped
    networks:
      - kolonie
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--configFile=/traefik.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - traefik_certs:/certs
    # The variable name is the same on both sides on purpose. It previously read
    # ${CLOUDFLARE_API_TOKEN} while .env defines CLOUDFLARE_DNS_API_TOKEN, so the
    # token resolved to an empty string and the ACME DNS challenge could never
    # complete — which is why no Let's Encrypt certificate was ever issued.
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:?set CLOUDFLARE_DNS_API_TOKEN in .env}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: kolonie-postgres
    restart: unless-stopped
    networks:
      - kolonie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolonie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kolonie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolonie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Public API + MCP (kolonie-platform / apps/api) ===
  # Serves api.kolonie.ai and academy.kolonie.ai. Routing lives in
  # traefik/dynamic/routes.yml, not in labels — see the note there.
  api:
    image: ghcr.io/kolonie-ai/kolonie-api:latest
    container_name: kolonie-api
    restart: unless-stopped
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - full

  # === Verifier Runner (kolonie-platform / apps/verifier-runner) ===
  # No Traefik route on purpose: it pulls submissions from the database and
  # talks outward to third-party APIs. Nothing on the internet reaches it.
  verifier-runner:
    image: ghcr.io/kolonie-ai/kolonie-verifier-runner:latest
    container_name: kolonie-verifier-runner
    restart: unless-stopped
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      GITHUB_VERIFIER_TOKEN: ${GITHUB_VERIFIER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Website (kolonie-website, static Astro build behind nginx) ===
  website:
    image: ghcr.io/kolonie-ai/kolonie-website:latest
    container_name: kolonie-website
    restart: unless-stopped
    networks:
      - kolonie
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - full
