name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, backend, frontend, academy)'
        required: false
        default: 'all'

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  DEPLOY_DIR: /opt/kolonie

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_DIR }}

            # Pull latest infra config
            git pull origin main

            # Run deployment
            SERVICE="${{ github.event.inputs.service || 'all' }}"
            chmod +x scripts/*.sh
            ./scripts/deploy.sh "$SERVICE"

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_DIR }}
            ./scripts/healthcheck.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check VPS logs."
          # TODO: Add Slack/Discord/GitHub Issue notification
