# Traefik Dynamic Configuration — TLS
# Kolonie AI

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      sniStrict: true

    # Authenticated origin pull (#24). Defined here and attached to routers in
    # routes.yml, one at a time.
    #
    # ## What this proves that the address allowlist cannot
    #
    # #21 restricted 80 and 443 to Cloudflare's published ranges, which proves a
    # request came through *a* Cloudflare edge. Those ranges are shared by every
    # Cloudflare customer, so anyone can point a hostname of their own at this
    # origin and arrive from a trusted address — controlling `CF-Connecting-IP`
    # on the way through, which is what the registration rate limit keys on
    # (kolonie-platform D-028).
    #
    # This certificate is ours. Cloudflare presents it only for this zone,
    # because it was uploaded to this zone, so verifying it narrows "came through
    # Cloudflare" to "came through us".
    #
    # ## Why not Cloudflare's shared certificate
    #
    # Turning on authenticated origin pull without uploading a certificate makes
    # Cloudflare present *its* shared one, which every zone with the feature
    # enabled also presents. Verifying that proves exactly what the address
    # allowlist already proves, so it would add a moving part and no guarantee.
    #
    # ## The CA in this file is public material
    #
    # `origin-pull-ca.pem` is a certificate, not a key. It is committed so the
    # deploy is reproducible. The CA's private key never leaves the maintainer's
    # machine, and the client key exists in exactly two places: that machine and
    # Cloudflare, which has to hold it in order to present it.
    #
    # **Expiry: the client certificate runs to 2031-07-27, the CA to 2036-07-25.**
    # An expired client certificate is a site-wide outage that shows as 526 at
    # the edge while every container here reports healthy — see AGENTS.md.
    mtls:
      minVersion: VersionTLS12
      sniStrict: true
      clientAuth:
        caFiles:
          - /dynamic/origin-pull-ca.pem
        # Require, not Verify-if-given: a request with no client certificate is
        # exactly the request this exists to refuse.
        clientAuthType: RequireAndVerifyClientCert
