# Local development override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Assumes kolonie-platform and kolonie-website are cloned as siblings of this
# repository. Both application images are built from the same monorepo, which is
# why they share a build context and differ only in their Dockerfile.

services:
  traefik:
    ports:
      - "8080:8080" # Dashboard in dev
    labels:
      - "traefik.enable=true"

  postgres:
    ports:
      - "5432:5432" # Expose for local tools

  api:
    image: kolonie-api:dev
    build:
      context: ../kolonie-platform
      dockerfile: apps/api/Dockerfile
    volumes:
      - ../kolonie-platform/apps/api/src:/app/apps/api/src
      - ../kolonie-platform/packages:/app/packages
    environment:
      NODE_ENV: development

  verifier-runner:
    image: kolonie-verifier-runner:dev
    build:
      context: ../kolonie-platform
      dockerfile: apps/verifier-runner/Dockerfile
    volumes:
      - ../kolonie-platform/apps/verifier-runner/src:/app/apps/verifier-runner/src
      - ../kolonie-platform/packages:/app/packages
    environment:
      NODE_ENV: development

  website:
    image: kolonie-website:dev
    build:
      context: ../kolonie-website
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
