name = "kolonie-email-inbound"
main = "src/worker.js"
compatibility_date = "2026-07-29"

# No HTTP surface at all. This Worker is triggered by an arriving message and by
# nothing else, so it needs neither a route nor a workers.dev subdomain.
#
# Without this line wrangler refuses to deploy — "you can either deploy your
# worker to one or more routes ... or register a workers.dev subdomain" — and the
# obvious way out is to register the subdomain, which would give this Worker a
# public HTTPS endpoint it has no business having. Saying `false` is what deploys
# it as an email handler and nothing more.
workers_dev = false

# **No `send_email` binding, deliberately.**
#
# An earlier version of this file declared one, on the assumption that replying
# needs the same grant as sending. It does not, and the two are different
# capabilities:
#
#   env.BINDING.send()  sends to an address — and Cloudflare only permits
#                       addresses already verified in the account, so it could
#                       never mail an arriving agent's mailbox anyway
#   message.reply()     answers the message currently in hand, needs no binding,
#                       and needs no address to have been verified
#
# Cloudflare's own reply example declares no binding, and asking for one here
# would request a capability this Worker must never have: the ability to send
# mail that nobody asked for.
# https://developers.cloudflare.com/email-routing/email-workers/reply-email-workers/
#
# What `reply()` requires instead — all satisfied by how the rung works, but
# check these first if a reply ever fails to arrive:
#
#   - the incoming mail must pass DMARC
#   - one reply per message, and the reply's recipient must be its sender
#   - the sending domain must be the domain that received it
#   - fewer than 100 entries in the incoming References header

[vars]
# The domain whose mail this Worker is allowed to act on. Everything else that
# reaches it via the zone catch-all is forwarded untouched — see the first check
# in src/worker.js for why that ordering is the safety property.
CHALLENGE_DOMAIN = "challenge.kolonie.ai"

# The API endpoint the Worker hands arriving mail to. A var rather than a secret
# — it is a public URL, and having it visible in the dashboard is worth more than
# hiding an address anyone can find in the OpenAPI surface anyway.
INBOUND_URL = "https://api.kolonie.ai/v1/internal/email-inbound"

# Two values are secrets and are **not** here:
#
#   wrangler secret put EMAIL_INBOUND_SECRET
#   wrangler secret put FORWARD_TO
#
# EMAIL_INBOUND_SECRET has to match /opt/kolonie/.env on the deploy host exactly.
# Two places, one value, and neither of them a repository.
#
# FORWARD_TO is where mail that is not the Colony's gets forwarded. It is a
# secret rather than a var because it is a **person's mailbox** — the one piece
# of personal data this component touches, and `AGENTS.md` §9 keeps that class of
# thing out of repositories as firmly as it keeps out credentials. It must be a
# verified destination address in the Cloudflare account or the forward is
# refused.
