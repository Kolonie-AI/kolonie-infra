# Promtail — the agent that ships container logs into Loki (#68)
#
# **It reads Docker's log files. It does not mount the Docker socket.** Mounting
# the socket into a container gives that container root on the host: anything
# that can talk to the socket can start a privileged container with / bind-
# mounted. Promtail's `docker_sd_configs` wants exactly that, for the sake of
# discovering container names — and the same names are available from the log
# lines themselves, see below. A log shipper is not worth a root-equivalent
# credential.
#
# The read is `/var/lib/docker/containers:ro`, which is Docker's own json-file
# output. Rotation is Docker's (`x-logging` in docker-compose.yml, 50 MB × 3);
# what Loki adds is retention across a container being recreated, search across
# services, and an answer without an SSH session.

server:
  http_listen_port: 9080
  # Promtail's gRPC server has no consumer here. 0 disables it rather than
  # binding a port nothing connects to.
  grpc_listen_port: 0
  log_level: info

# How far into each file Promtail has read. On a named volume, not the container
# filesystem: without it, a recreated Promtail re-reads every file from the start
# and every line already in Loki arrives a second time.
positions:
  filename: /promtail/positions.yaml

clients:
  # The internal network name. Loki is not reachable from outside the host except
  # through Traefik, and Promtail does not go that way — it would be asking the
  # public edge for a service sitting beside it.
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # 1. Unwrap Docker's own envelope.
      #
      # Every line in a json-file log is `{"log": "<the line>\n", "stream":
      # "stdout", "attrs": {...}, "time": "<RFC3339Nano>"}`. The application's
      # own line is a *string* inside it, and that string is what has to reach
      # Loki intact — kolonie-platform#230 made those lines JSON precisely so
      # `| json` can be used at query time.
      - json:
          expressions:
            line: log
            attrs: attrs
            time: time

      # 2. Where the `service` label comes from, without the socket.
      #
      # This is the whole reason the socket is not needed. Docker's json-file
      # driver copies any container label named in `--log-opt labels=` into an
      # `attrs` object on every line it writes, and Compose sets
      # `com.docker.compose.service` on every container it starts. So the file
      # already carries the service name, and `x-logging` in docker-compose.yml
      # is what asks for it — remove that option and this stage silently
      # produces nothing, which is the one coupling between the two files.
      #
      # The container *id* is deliberately not used, although it is right there
      # in the path. It changes on every recreation, so it is a new stream on
      # every deploy: the textbook way to make a Loki index unusable.
      - json:
          source: attrs
          expressions:
            service: '"com.docker.compose.service"'

      # 3. Docker's timestamp, not the moment Promtail read the file. After a
      # restart Promtail catches up on a backlog in seconds, and without this
      # every one of those lines would be stamped with the catch-up.
      - timestamp:
          source: time
          format: RFC3339Nano

      # 4. `level` off the application's own line. It is a label because it is
      # the one field every query filters on and it has five possible values;
      # everything else in that line stays inside it, searchable with `| json`
      # and costing no index.
      - json:
          source: line
          expressions:
            level: level

      - labels:
          service:
          level:

      # 5. A level for the services that do not write one (#80).
      #
      # **Six of eleven services never emitted a level, so they could not report
      # a failure to anything that filters on one** — and every query the Watch
      # Agent makes filters on it. Measured over 24 hours to 2026-08-05: 53,188
      # lines a day, about 71 %, carried no level, and `postgres`, `traefik`,
      # `website` and `pgadmin` were structurally invisible to the one thing that
      # reads the logs. The blind spot was not empty: 26 postgres errors and 6
      # website `5xx` in that window.
      #
      # **Derived here rather than in a query.** A query that re-derives a level
      # is a second definition, and the one that drifts is the one an alarm reads.
      #
      # **No new labels.** The permitted set is still `job`, `service`, `level`,
      # for the reason stage 7 gives. What grows is `level`'s value set, by one:
      # `interactive`, and it is bounded — see the postgres block.
      #
      # Each block is a `match` on one service, so nothing already labelled
      # changes. The four Node services keep the levels they emit; a regex that
      # matches nothing is a no-op, so a line these expressions do not recognise
      # arrives exactly as it did before.

      # 5a. Postgres: its own severity, and interactive sessions told apart.
      #
      # **The trap this is written around.** The 26 errors in the blind spot were
      # benign — `column v.passed does not exist`, `relation "verdicts" does not
      # exist`, `syntax error at or near "\"` — and every one of them is a
      # maintainer or an agent typing at a `psql` prompt against production.
      # Labelling severity naively would turn every typo into an incident, and a
      # watcher that cries wolf is a watcher nobody reads.
      #
      # **Told apart by the connecting client, which Postgres already records**,
      # rather than by guessing at the SQL. `log_line_prefix` in
      # `docker-compose.yml` now carries `%q%u@%d/%a` — user, database and
      # application name, and `%q` omits all three for the background processes
      # that have no session. `psql` and `pgAdmin` set that name themselves; the
      # platform's own pool sends none, so **unrecognised means application**,
      # which is the safe direction: an unlabelled application error stays
      # visible, and only a client that positively identifies itself as a human's
      # tool is set aside.
      #
      # `interactive` is excluded from the watcher's queries rather than dropped.
      # A maintainer's mistyped query is still worth being able to look up — it is
      # simply not an incident.
      - match:
          selector: '{service="postgres"}'
          stages:
            # `source: line` on every expression below, and it is the whole
            # correctness of this block: without it a regex runs against
            # Docker's JSON envelope rather than against the application's line,
            # and an expression can appear to work by matching the escaped copy
            # inside it. Verified by a `promtail -dry-run` over one line of each
            # shape before this landed.
            - regex:
                source: line
                expression: '^\S+ \S+ \S+ \[\d+\] (?:(?P<pg_user>[^@\s]+)@(?P<pg_db>[^/\s]+)/(?P<pg_app>\S*) )?(?P<pg_severity>[A-Z]+):'
            - template:
                source: level
                template: >-
                  {{- $app := .pg_app | default "" -}}
                  {{- $severity := .pg_severity | default "" -}}
                  {{- if or (eq $app "psql") (hasPrefix "pgAdmin" $app) -}}
                  interactive
                  {{- else if or (eq $severity "ERROR") (eq $severity "FATAL") (eq $severity "PANIC") -}}
                  error
                  {{- else if eq $severity "WARNING" -}}
                  warn
                  {{- else if eq $severity "" -}}
                  {{- else -}}
                  info
                  {{- end -}}
            - labels:
                level:

      # 5b. The three that speak Common Log Format.
      #
      # `traefik`, `website` (nginx) and `pgadmin` all write CLF access lines, so
      # one expression covers all three — which is why `pgadmin` and `website`
      # are here at all. `#80` called them lower value and worth doing *if the
      # pipeline makes it free*, and it does.
      #
      # Traefik also writes its own logfmt lines on the same stream, so its level
      # is read first and the status is only consulted when there is none.
      #
      # **`5xx` is an error and `4xx` is not.** A `4xx` is the client being
      # wrong, and routine `404`s — a scanner, an `mcp` probe — would fill a warn
      # query with traffic nobody has to act on. What the blind spot actually
      # contained was `5xx`, which is the Colony being wrong.
      - match:
          selector: '{service=~"traefik|website|pgadmin"}'
          stages:
            # `source: line` for the reason the postgres block gives.
            - regex:
                source: line
                expression: '^time="[^"]*" level=(?P<edge_level>\w+)'
            - regex:
                source: line
                expression: '"[^"]*" (?P<http_status>\d{3}) '
            - template:
                source: level
                template: >-
                  {{- $level := .edge_level | default "" -}}
                  {{- $status := .http_status | default "" -}}
                  {{- if ne $level "" -}}
                  {{ $level | lower }}
                  {{- else if eq $status "" -}}
                  {{- else if ge (atoi $status) 500 -}}
                  error
                  {{- else -}}
                  info
                  {{- end -}}
            - labels:
                level:

      # 6. **The cardinality rule, enforced rather than stated.**
      #
      # `filename` is attached automatically by the file target and its value is
      # `/var/lib/docker/containers/<64-hex-id>/<64-hex-id>-json.log`. Left on,
      # every container recreation creates a fresh stream for every service, and
      # the index grows with the deploy count forever. This is the single most
      # common way a Loki install becomes unusable and it is invisible until it
      # is severe.
      #
      # The permitted set is `job`, `service`, `level`. Anything identifying a
      # request, an agent, a ticket or a container belongs *inside* the JSON
      # line, where `| json` finds it at read time for no index cost.
      - labeldrop:
          - filename

      # 6. The observability stack stops describing itself (#81).
      #
      # Measured over 24 hours to 2026-08-05: `loki` wrote 19,534 lines and
      # `promtail` 12,525 — **32,059 a day, about 42 % of everything stored**.
      # Together they logged more than every service they exist to observe, and
      # `api` produced 1,060 in the same window. Nothing is broken; Loki is
      # logging at its default level about doing its job, and it is simply not
      # worth a share of a 30-day retention window.
      #
      # **Dropped at ingestion rather than quietened at the source.** Raising
      # each component's own log level leaves a setting a version bump can
      # silently reset, in a file that is not this one. A drop stage is in the
      # file that owns the pipeline, and if Loki ever does break, that shows up
      # as *missing data* rather than as its own error lines.
      #
      # **`warn` and above survive.** A Loki that is refusing writes has to be
      # able to say so. Both write logfmt with `level=` first on the line, so
      # parsing it costs one expression — and the level is kept as a label, or a
      # surviving warning would arrive invisible to the one thing that reads it.
      #
      # **A line whose level does not parse is kept.** That is the safe
      # direction: a Go panic and a stack trace carry no `level=`, and those are
      # exactly the lines worth having.
      #
      # This is the only drop in the pipeline. Every other service keeps every
      # line, and `traefik` at 19 % is deliberately untouched — it is the only
      # record of who reached the Colony and with what status, and volume is not
      # the test.
      - match:
          selector: '{service=~"loki|promtail"}'
          stages:
            - regex:
                source: line
                expression: '^level=(?P<stack_level>\w+)'
            - labels:
                level: stack_level
            - drop:
                source: stack_level
                expression: '^(?:debug|info)$'
                drop_counter_reason: observability_stack_chatter

      # 7. Forward the application's line exactly as it was written, with
      # Docker's envelope stripped and nothing reformatted.
      - output:
          source: line
