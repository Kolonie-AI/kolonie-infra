# Container logs that cannot fill the disk (#37).
#
# Docker's default json-file driver has **no cap at all**: a container logs until
# the partition is full, and then every service on the host fails at once for a
# reason none of their logs can record, because there is nowhere left to record
# it. Nothing on this host rotated container logs before this.
#
# 50 MB across 3 files is 150 MB per container and about 900 MB for the stack —
# affordable on this disk, and long enough to still hold a startup exception a
# day later. That matters more here than usual: since kolonie-infra#43 the deploy
# quotes a failing container's log before rolling it back, and a rotation window
# shorter than the gap between a bad deploy and somebody reading about it would
# quietly hollow that out.
#
# Applied per service through a YAML anchor rather than daemon.json, so the
# policy is in the file that is reviewed and deployed rather than in host state
# nothing here can see — the class of gap kolonie-infra#42 is about.
#
# **This takes effect when a container is recreated, not when the file changes.**
# A running container keeps the policy it started with.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

networks:
  kolonie:
    name: kolonie
    driver: bridge

volumes:
  postgres_data:
  traefik_certs:
  pgadmin_data:

services:
  # === Traefik Reverse Proxy ===
  traefik:
    image: traefik:v3.7
    container_name: kolonie-traefik
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--configFile=/traefik.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - traefik_certs:/certs
      # Credentials the *dynamic configuration* needs, which is a different
      # problem from the ones .env solves (#30).
      #
      # Traefik does not interpolate environment variables in the files under
      # /dynamic. A basicAuth middleware therefore has exactly two ways to learn
      # its htpasswd line: written literally into traefik/dynamic/routes.yml,
      # which puts a password hash into a public repository, or read from a file
      # through `usersFile`. This mount is the second.
      #
      # The directory is untracked and .gitignore'd; deploy.sh's `git reset
      # --hard` does not touch untracked paths, so what an operator writes here
      # survives every deploy. A missing file is not an outage: Traefik logs the
      # middleware as invalid and drops the one router that references it, and
      # every other router keeps serving.
      - ./secrets:/secrets:ro
    # The two sides are different names on purpose, and neither is a typo.
    #
    # Left: what lego expects inside the Traefik container for the Cloudflare DNS
    # challenge. Right: what /opt/kolonie/.env on the deploy host actually
    # defines — verified by the diagnose workflow, not assumed.
    #
    # An earlier fix set both sides to CLOUDFLARE_DNS_API_TOKEN on the belief
    # that .env used that name. It does not, and marking the variable required
    # with :? turned a silent empty string into a hard failure of every deploy.
    # See #7.
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: kolonie-postgres
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolonie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kolonie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolonie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Public API + MCP (kolonie-platform / apps/api) ===
  # Serves api.kolonie.ai, academy.kolonie.ai, mcp.kolonie.ai and
  # challenge.kolonie.ai. Routing lives in
  # traefik/dynamic/routes.yml, not in labels — see the note there.
  #
  # The three application images are variables with a `:latest` default, and the
  # default is what makes this readable by hand — `docker compose up` on a fresh
  # host still does the obvious thing. `deploy.sh` never uses it: it resolves the
  # tag to an immutable digest after pulling and exports that, so the containers
  # it starts are pinned to a build that cannot change underneath them and can be
  # returned to later (#12).
  api:
    image: ${API_IMAGE:-ghcr.io/kolonie-ai/kolonie-api:latest}
    container_name: kolonie-api
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      JWT_SECRET: ${JWT_SECRET}
      # Salts the hashes of identifiers a *banned* citizen proved, which are the
      # only thing an erasure leaves behind (kolonie-platform#90, #92). An
      # unsalted digest of a mailbox address is reversible with a wordlist, so
      # `packages/db` refuses to start without it rather than writing marks that
      # protect nothing.
      #
      # **`:?` rather than a default, and the shape of the outage that earned it.**
      # This variable landed with #93 on 2026-07-30 and reached neither this file
      # nor the host's .env. Every deploy since then failed the same way: the api
      # container threw at startup, sat unhealthy for 180s, and the deploy rolled
      # back — six times, each one looking like a health-check problem rather than
      # a missing variable. That is #7 exactly, one variable over. With `:?`,
      # Compose names it and stops before anything moves.
      BAN_MARK_SALT: ${BAN_MARK_SALT:?set BAN_MARK_SALT in .env — openssl rand -hex 32}
      HCAPTCHA_SITEKEY: ${HCAPTCHA_SITEKEY}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET}
      # Where the hCaptcha badge's page lives. It has a default here rather than
      # being required in .env because kolonie-platform may not contain a host
      # name in any file (its AGENTS.md §3), so the API composes the agent-facing
      # url from configuration and this is the configuration. A routing fact
      # belongs in the repository that owns routing.
      CHALLENGE_PAGE_URL: ${CHALLENGE_PAGE_URL:-https://challenge.kolonie.ai/captcha/}
      # The same read-only token the verifier-runner holds, and deliberately the
      # same variable name — one credential, one name, which is kolonie-infra#7's
      # whole lesson (.env defined CLOUDFLARE_API_TOKEN while compose demanded
      # CLOUDFLARE_DNS_API_TOKEN, and every deploy failed for days).
      #
      # The api needs it for `kolonie.contributions.list` (kolonie-docs#43): a
      # citizen asking which of its own pull requests a reviewer has answered.
      # That is a read of somebody else's system from the request path, which no
      # other api surface does — every other Academy rung here either mints a
      # nonce or checks a signature.
      #
      # Unset is a working configuration and not a degraded one. The tool then
      # reports that the Colony **could not ask**, which is deliberately not the
      # same answer as "nothing is waiting on you" — an agent told the second
      # when the first is true goes back to sleep on a review it needed, which is
      # the exact bug kolonie-docs#43 exists to close.
      GITHUB_VERIFIER_TOKEN: ${GITHUB_VERIFIER_TOKEN:-}
      # Where Academy Level 1 lives — the rung that promotes (kolonie-platform
      # D-029). Same arrangement as the line above, and deliberately **not**
      # grouped with the HCAPTCHA_ variables.
      #
      # The whole point of the Level 1 rebuild is that a promoting rung depends
      # on nothing an outside party controls. Until 2026-07-29 one condition
      # covered the entire Academy surface, so an unset hCaptcha sitekey — a
      # third party's value, for a task that is now optional — disabled Level 1
      # and stalled every arriving agent. kolonie-platform has a test that fails
      # if that coupling comes back in its code; this comment is the same
      # guard one layer down, where no test can see it. Do not make this
      # conditional on the hCaptcha values.
      CAPABILITY_PAGE_URL: ${CAPABILITY_PAGE_URL:-https://challenge.kolonie.ai/browser/}
      # The four stages above the entry rung, added 2026-08-01 with
      # kolonie-platform#160-#164. Each stage resolves its own address and
      # disables only itself when that address is unset, saying so in the startup
      # line — which is the same lesson as the block above, one level further:
      # one shared condition is how an unset third-party value took a whole
      # branch down. A stage missing from here is a stage that refuses its own
      # mints and leaves the rest of the ladder standing.
      #
      # Defaults rather than required values, because the pages are served by
      # this same API container on paths it registers itself. There is no secret
      # here and nothing a third party owns; the host name is configuration
      # because kolonie-platform may hold none.
      PERSISTENCE_PAGE_URL: ${PERSISTENCE_PAGE_URL:-https://challenge.kolonie.ai/persistence/}
      PERCEPTION_PAGE_URL: ${PERCEPTION_PAGE_URL:-https://challenge.kolonie.ai/perception/}
      INTERACTION_PAGE_URL: ${INTERACTION_PAGE_URL:-https://challenge.kolonie.ai/interaction/}
      INTERSTITIAL_PAGE_URL: ${INTERSTITIAL_PAGE_URL:-https://challenge.kolonie.ai/interstitial/}
      # Academy Level 2, the mailbox rung. Same arrangement as the two page urls
      # above: kolonie-platform may hold no host name, so the domain challenge
      # addresses are minted under is configuration and arrives here.
      EMAIL_CHALLENGE_DOMAIN: ${EMAIL_CHALLENGE_DOMAIN:-challenge.kolonie.ai}
      # No default, and no `:?` either. Unset, the API leaves the inbound route
      # unmounted — which is the correct behaviour and must stay reachable, so
      # this may not be made mandatory. A default would be worse still: it would
      # be a shared secret published in a public repository.
      EMAIL_INBOUND_SECRET: ${EMAIL_INBOUND_SECRET:-}
      # The API sends the Level 2 code itself. All three together or none: the
      # rung answers 503 unless it can actually deliver, rather than handing an
      # agent a challenge whose code has nowhere to go.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_SEND_TOKEN: ${CLOUDFLARE_EMAIL_SEND_TOKEN:-}
      ACADEMY_SENDER_ADDRESS: ${ACADEMY_SENDER_ADDRESS:-}
      # The wake-up rhythm bounds (#61, kolonie-platform#142). Optional: absent
      # means the default compiled into the API — 6 / 12 / 24 hours — and a
      # deployment that sets none of the three is not diminished, which is why
      # they carry `:-` and are not in REQUIRED_ENV.
      #
      # **They are listed here because otherwise .env cannot reach them.** This
      # service has no `env_file`, so a variable that is not named in this block
      # is invisible to the container however carefully an operator sets it. That
      # was the state until 2026-08-02: `apps/api/src/rhythm.ts` read three
      # variables that nothing in this repository passed, so the configuration
      # #142 built existed and could not be used.
      #
      # RHYTHM_MIN_HOURS is the one expected to fall, once Quests give a citizen
      # a reason to come back more often than the Academy does. Lowering it is a
      # deploy setting rather than a release plus four skill re-publications, and
      # that is the whole point of #142.
      #
      # A contradictory range — a minimum above the maximum, or a default outside
      # the range — makes the API throw at startup. Deliberately: it is a
      # configuration mistake that otherwise produces a Colony behaving strangely
      # rather than one visibly broken, and startup is where an operator is
      # watching.
      RHYTHM_MIN_HOURS: ${RHYTHM_MIN_HOURS:-}
      RHYTHM_DEFAULT_HOURS: ${RHYTHM_DEFAULT_HOURS:-}
      RHYTHM_MAX_HOURS: ${RHYTHM_MAX_HOURS:-}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than localhost, for the reason spelled out on the
      # website service below. curl happens to retry the other address family
      # where wget does not, so this one was not failing — but relying on that
      # difference between two tools is not a property worth depending on.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-w", "health %{http_code}", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - full

  # === Verifier Runner (kolonie-platform / apps/verifier-runner) ===
  # No Traefik route on purpose: it pulls submissions from the database and
  # talks outward to third-party APIs. Nothing on the internet reaches it.
  verifier-runner:
    image: ${RUNNER_IMAGE:-ghcr.io/kolonie-ai/kolonie-verifier-runner:latest}
    container_name: kolonie-verifier-runner
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      GITHUB_VERIFIER_TOKEN: ${GITHUB_VERIFIER_TOKEN:-}
      # Solana, for the four earning rungs (kolonie-platform #61, #63, #64, #65).
      # Unset is a working configuration and not a degraded one: the code falls
      # back to Solana's own public mainnet endpoint, which needs no credential.
      # Set this to a paid endpoint when the free one's rate limit starts showing
      # up as submissions sitting `pending` — that is the symptom, and it costs an
      # agent nothing but time, because an unreadable endpoint re-queues rather
      # than failing anyone.
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      # The image rung (kolonie-platform#60) hands a picture to a vision model.
      # **The same key the moderation runner uses**, deliberately: one account,
      # one credential, one name. Two names for one key is kolonie-infra#7.
      #
      # Defaulted to empty for the reason spelled out on the moderation runner
      # below — an unset key has to degrade this service rather than take it
      # down. It degrades differently here, and worse: image submissions verdict
      # `pending` and wait, so the rung is seeded `draft` until this is set.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Which model looks at the image. Unset means the code's own default, the
      # same arrangement OPENROUTER_MODEL has one service down. It has to accept
      # an image *and* honour a JSON schema, which rules out most cheap vision
      # models rather than a few.
      VISION_MODEL: ${VISION_MODEL:-}
      # Which model reads a citizen's bio at Academy Level 0
      # (kolonie-platform#137). A text model, not the vision one: the question
      # has no image in it. Unset means the code's own default.
      #
      # **Unlike every other model variable here, leaving this unset does not
      # park a rung.** Level 0 stands in front of the whole graph, so an
      # unreachable judge degrades towards *passing* — a citizen that wrote a
      # real bio is certified on the structural bar alone, and the verdict
      # records that nobody read it. An outage of ours must not close the door.
      BIO_MODEL: ${BIO_MODEL:-}
      POLL_INTERVAL_MS: ${VERIFIER_POLL_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Was `node -e "process.exit(0)"`, which asked whether the process exists
      # and reported healthy for a process wrapped around a dead polling loop —
      # exactly the class of lie in #11. The endpoint answers whether a poll has
      # completed recently, and 503 when it has not; `r.ok` turns that into the
      # exit code Compose actually reads.
      #
      # 127.0.0.1 rather than localhost, for the reason spelled out on the
      # website service below. No curl in this image, and none is added for one
      # request that Node can make itself.
      #
      # **It prints what it saw** (#54). Every branch used to end in a bare
      # `process.exit`, so a dead process, a 503 from a stalled poll loop and a
      # timeout were one exit code with no text between them — and they need
      # three different responses. On 2026-07-31 this container flapped for half
      # an hour and the complete record Docker held of why was `exit=1, exit=0,
      # exit=1, exit=1, exit=1`.
      #
      # A status number and an error code, and nothing else: `.State.Health.Log`
      # is read into a public issue by Health Watch, so no body, no headers, no
      # environment. One short line keeps the healthy path from burying the
      # failing entries — Docker keeps only the last five.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{console.log('health '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable: '+(e.cause?.code||e.code||e.message));process.exit(1)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Moderation Runner (kolonie-platform / apps/moderation-runner) ===
  # No Traefik route, for the same reason as the verifier runner: it reads
  # struggles and tips from the database and talks outward to OpenRouter.
  # Nothing on the internet reaches it.
  moderation-runner:
    image: ${MODERATION_IMAGE:-ghcr.io/kolonie-ai/kolonie-moderation-runner:latest}
    container_name: kolonie-moderation-runner
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      # Defaulted to empty rather than required. An unset key degrades this
      # service and stops nothing: entries stay `pending`, pending entries are
      # never served, and the read endpoints answer empty arrays. Compose
      # refusing to interpolate would instead take the container down, and the
      # health endpoint is how anyone would find out it was missing.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Which model judges is a decision that will be revisited against a real
      # corpus, so it is configuration. Unset means the code's own default.
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
      # A minute, where the verifier runner polls every five seconds. Nothing
      # waits on a moderation verdict: an agent that filed a struggle was heard
      # when the row was written, and whether it is published is a question for
      # other agents, later.
      POLL_INTERVAL_MS: ${MODERATION_POLL_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Same shape and same reason as the verifier runner's: `process.exit(0)`
      # reports healthy for a process wrapped around a dead polling loop (#11).
      # It matters more here — a stalled moderator publishes nothing, and a
      # Colony that publishes nothing looks exactly like one where nobody has
      # written anything.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>{console.log('health '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable: '+(e.cause?.code||e.code||e.message));process.exit(1)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Support Triage Runner (kolonie-platform / apps/support-triage-runner) ===
  # No Traefik route, for the same reason as the other two runners: it reads the
  # support tickets citizens filed over MCP and talks outward to OpenRouter and
  # GitHub. Nothing on the internet reaches it.
  support-triage-runner:
    image: ${TRIAGE_IMAGE:-ghcr.io/kolonie-ai/kolonie-support-triage-runner:latest}
    container_name: kolonie-support-triage-runner
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://kolonie:${POSTGRES_PASSWORD}@postgres:5432/kolonie
      BAN_MARK_SALT: ${BAN_MARK_SALT:?set BAN_MARK_SALT in .env — openssl rand -hex 32}
      # **The same key again, third service to read it.** One account, one
      # credential, one name — kolonie-infra#7's whole lesson. Defaulted to empty
      # for the reason the moderation runner gives: an unset key has to degrade
      # this service rather than take it down. It degrades quietly here, and the
      # degradation is exactly the state that existed before this service did —
      # tickets accumulate `open` and nobody reads them.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Which model triages. Unset means the code's own default.
      TRIAGE_MODEL: ${TRIAGE_MODEL:-}
      # The GitHub App this files issues as (kolonie-infra#55).
      #
      # **The id is not a secret and the key is**, so only the id is here. The id
      # is in the App's public URL; the RSA private key is multi-line and has no
      # business in a `.env`, so it lives in ./secrets — the directory Traefik's
      # htpasswd already uses, which deploy.sh creates and .gitignore covers —
      # and is mounted read-only below.
      #
      # Unset is a working configuration: the runner then reads tickets, matches
      # them against nothing, and files nothing. That is worse than working and
      # much better than a container that will not start.
      GITHUB_TRIAGE_APP_ID: ${GITHUB_TRIAGE_APP_ID:-}
      GITHUB_TRIAGE_APP_KEY_PATH: /secrets/kolonie-triage-app.pem
      # Half an hour, against the moderation runner's minute. Nothing waits on a
      # triage verdict the way a citizen waits on a moderation one — and a longer
      # tick means two reports of the same thing usually land in one pass and
      # produce one issue rather than two.
      POLL_INTERVAL_MS: ${TRIAGE_POLL_INTERVAL_MS:-1800000}
    # **Runs as the user that owns the key, and the numbers are measured.**
    #
    # The image ships `USER node`, which is uid 1000 inside it. The App key is
    # `0600` and owned by the deploy user, so as `node` this process gets EACCES
    # and files nothing — which it reports and survives, but it is not what
    # anybody wanted.
    #
    # The obvious fix is `chown 1000` on the host, and on this host it is wrong:
    # uid 1000 is **`admin`** and gid 1000 is **`wheel`**, both real. Handing a
    # private key to them because a container happened to pick the same numbers
    # is a widening disguised as a permission fix. Measured 2026-08-01, not
    # assumed — Traefik gets away with reading its htpasswd only because it runs
    # as root, and this service deliberately does not.
    #
    # So the container takes the deploy user's identity instead, and the key
    # stays `0600` with nothing on the host gaining access. A variable rather
    # than a literal because these numbers belong to *this* host: a rebuild that
    # lands on different ones sets it, and a wrong value degrades — the runner
    # logs EACCES and files nothing — rather than taking the container down.
    user: "${SECRETS_READER:-1001:1002}"
    volumes:
      # Read-only, and the same directory Traefik reads its htpasswd from. A
      # missing key is not an outage: the runner says so at startup and files
      # nothing.
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Same shape and same reason as the other two runners': `process.exit(0)`
      # reports healthy for a process wrapped around a dead polling loop (#11).
      #
      # The endpoint also serves the queue depth, and deliberately does not let a
      # deep queue answer 503 — a backlog is the failure this service exists to
      # prevent and restarting the container would do nothing about it. Read the
      # body to see it; the status code is about the loop alone.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>{console.log('health '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable: '+(e.cause?.code||e.code||e.message));process.exit(1)})",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # === Website (kolonie-website, static Astro build behind nginx) ===
  #
  # Its own profile, not `full`. The reason has changed and the arrangement has
  # not: the kolonie-website repository now exists and this image is published
  # and running, so the original argument — `docker compose pull` fails the whole
  # command when any one image is missing, taking api and verifier-runner down
  # with it — no longer applies.
  #
  # What keeps it separate now is blast radius. The website is the one service
  # whose failure costs nothing operational, and it is also the one that took the
  # whole stack down once (#11): it sat unhealthy for days while serving
  # perfectly, a deploy read that status, and the rollback stopped everything for
  # half an hour. A service that can be deployed on its own can also be left
  # alone on its own.
  #
  # `full` therefore means "the API and the two runners behind it". Deploy this one
  # with --profile website.
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/kolonie-ai/kolonie-website:latest}
    container_name: kolonie-website
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    healthcheck:
      # 127.0.0.1, never localhost. The image's /etc/hosts maps localhost to
      # both 127.0.0.1 and ::1; BusyBox wget tries ::1 first and nginx listens
      # on IPv4 only, so the check failed with "connection refused" while the
      # site served every request correctly. The container sat unhealthy for
      # days without anyone noticing — until a deploy read that status and
      # rolled the whole stack back. See kolonie-infra#11.
      test: ["CMD", "wget", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - website

  # === pgAdmin 4 — the maintainer's browser client for the database (#30) ===
  #
  # Reachable at db.kolonie.ai behind two locks: Traefik basicAuth in front, and
  # pgAdmin's own login behind it. Postgres itself gains no `ports:` mapping and
  # keeps none — pgAdmin reaches it as `postgres:5432` on the internal network,
  # which is the whole reason this is worth running instead of opening 5432.
  #
  # **Its own profile, not `full`, and that is the one place this deviates from
  # what #30 proposed.** `full` is what every kolonie-platform merge deploys, and
  # healthcheck() in scripts/deploy.sh rolls the whole stack back when any
  # service in the active profiles is unhealthy. So in `full`, an admin console
  # that failed to start would take the API down with it — for a container whose
  # failure costs nothing operational. That is the website's argument (see its
  # comment above) and it applies here with more force, because this service also
  # depends on two variables a human has to add to the host's .env out of band.
  # Between merging this file and that edit there is a window, and in `full` that
  # window is one where every deploy fails. #7 and #93 are both exactly that
  # shape, and both cost days.
  #
  # detect_profile() therefore adds `--profile admin` only once the host defines
  # PGADMIN_PASSWORD, so a host that has not been set up simply never sees this
  # service, and one that has gets it pulled, started and health-checked with
  # everything else.
  #
  # Pinned to a version, not `:latest`. Everything else here is pinned to a
  # digest by deploy.sh after the pull; this image is not one deploy.sh knows
  # about, so the pin has to be in the tag. `:latest` on a third party's image
  # means an upstream release can change what this host runs without any commit
  # here — which is #12's complaint, arriving from outside instead of inside.
  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:9.17}
    container_name: kolonie-pgadmin
    restart: unless-stopped
    logging: *logging
    networks:
      - kolonie
    environment:
      # SERVER_MODE stays at the image's default of True, against the `False` in
      # #30's sketch. False is pgAdmin's desktop mode: it serves every request
      # without asking who is making it, and the second lock the issue's own
      # security posture asks for — "pgAdmin login, separate credentials" — would
      # then be a master-password prompt for stored server passwords rather than
      # a login. Behind basicAuth either is defensible; a real login is what the
      # acceptance criteria describe and the safer of the two to expose.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Neither is defaulted and neither is marked `:?`. Empty, the image's own
      # entrypoint refuses to start and says which variable it wanted, which is
      # the message worth having; `:?` would instead fail `docker compose` as a
      # whole, and this file is parsed on every deploy including the ones that
      # never activate this profile.
      #
      # pgAdmin writes its own SQLite config into the volume, so the login above
      # is read on *first* start only. Changing PGADMIN_PASSWORD later does not
      # change the account — reset it inside pgAdmin, or remove the volume.
      #
      # False follows from server mode. The master password exists to unlock
      # server passwords pgAdmin has stored; servers.json below stores none, so
      # requiring one adds a third prompt that guards an empty keyring. Two locks
      # is what #30 asked for and two is what this is.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # **Since #56 the header carries two entries, and this count still says
      # one.** That is deliberate for now, and it is the one thing to read before
      # changing a number here.
      #
      # `X-Forwarded-For` now arrives as `<client>, <cloudflare-edge>`: the
      # `websecure` entryPoint in traefik/traefik.yml trusts Cloudflare's
      # published ranges, so Traefik keeps the incoming header and appends to it
      # rather than discarding it. Until 2026-08-02 it arrived with exactly one
      # entry — the edge — and the paragraphs below were written against that.
      #
      # ProxyFix counts from the right, so a count of 1 still resolves to the
      # edge. What changed is that the client's address is now *present* in the
      # header, where before it existed only in `CF-Connecting-IP` — which
      # nothing here can be told to read. (apps/api/src/client-ip.ts in
      # kolonie-platform reads exactly that, which is why the API was unaffected
      # by any of this.)
      #
      # **Moving the count to 2 and putting `ENHANCED_COOKIE_PROTECTION` back on
      # is now possible and is a separate change**, wanting its own measurement
      # of what a session pins to. #56 made the correct answer available; it did
      # not make a naive configuration correct.
      #
      # **`ENHANCED_COOKIE_PROTECTION` is off, and that is the bug fix.** It
      # defaults on and pins a session to the address pgAdmin believes the client
      # has — here, a Cloudflare edge. Cloudflare answers from many, and a browser
      # opening parallel connections lands on several: one page load on
      # 2026-08-01 reported 104.23.199.178, 162.159.121.22, 104.23.199.250,
      # 104.23.199.160 and 104.23.199.207 as five different clients. Every
      # request therefore invalidated the session the one before it created, and
      # the login failed with **"The CSRF tokens do not match"** — a message that
      # names the symptom and points nowhere near the cause.
      #
      # Turning it off loses nothing, because it was never protecting anything:
      # a pin to an address that changes per request is not a defence, it is an
      # outage. Setting the count to 2 also "works", by running out of entries and
      # falling back to Traefik's own container address — stable, and a lie about
      # what the header contains. That was tried and rejected. Note that this
      # objection is the one #56 answered: with the ranges trusted, a count of 2
      # resolves to a real client rather than running off the end of the list.
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      # This host is reachable over https only — Traefik redirects `web` to
      # `websecure`. pgAdmin defaults this to False because it terminates plain
      # HTTP itself and cannot know that, so the cookie carrying an admin session
      # was not marked Secure. Saying so here costs nothing and closes the case
      # where a future misconfiguration serves the same cookie over plaintext.
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # The connection is registered for the operator rather than typed in by
      # hand, so "it can reach the database" is a property of this file instead
      # of a step somebody has to remember. Host, port and user only — pgAdmin
      # asks for the password at connect time, and POSTGRES_PASSWORD does not
      # belong in a tracked file.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /misc/ping is pgAdmin's own unauthenticated liveness endpoint, and the
      # check its container documentation recommends. 127.0.0.1 rather than
      # localhost, for the reason spelled out on the website service above.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Longer than anything else here on purpose: pgAdmin migrates its SQLite
      # config on first start and takes tens of seconds to answer. Judged too
      # early it looks like a failing container, and healthcheck() rolls the
      # stack back over a service that was merely slow.
      start_period: 60s
    profiles:
      - admin
