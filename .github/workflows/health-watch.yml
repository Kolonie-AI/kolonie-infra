name: Health Watch

# Notices a container that is unhealthy but still serving (#11).
#
# On 2026-07-28 kolonie-website was unhealthy for an unknown number of days while
# answering every request correctly. Nothing reported it. It surfaced when a
# docs-only push triggered a deploy, the deploy read the health status, and the
# rollback took the site down for half an hour. The wrong status was cheap to fix
# — 127.0.0.1 instead of localhost — and expensive to discover late, because
# everything downstream treats it as truth.
#
# The gap was not that the stack had no health checks. It was that the only
# reader of them ran at deploy time. This workflow is a second reader that runs
# whether or not anyone deploys.
#
# **Where the notification goes: a GitHub issue.** AGENTS.md §3 in kolonie-docs
# says every open task is an issue and no task lives anywhere else, so that is
# where this project actually looks. A Slack webhook or an emailed alert would be
# a second place to look that nobody has agreed to look at, and it would not
# survive the maintainer being replaced by another agent — which is the property
# the whole process is built around.

on:
  schedule:
    # Every fifteen minutes. GitHub delays scheduled runs under load and drops
    # them outright sometimes, so this is a floor on latency and not a promise:
    # the thing being caught sat broken for days, and catching it within the hour
    # is the whole win. Do not tighten this in the hope of precision it cannot
    # give.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A second run starting while one is mid-way through filing an issue would
# duplicate it. Queue rather than cancel — a cancelled run reports nothing, and
# silence is the failure mode this workflow exists to end.
concurrency:
  group: health-watch
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ubuntu
  DEPLOY_DIR: /opt/kolonie
  ISSUE_TITLE: 'Containers on the deploy host are unhealthy'
  DRIFT_ISSUE_TITLE: 'The deploy host is not serving what was last built'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plain ssh rather than appleboy/ssh-action, which the rest of this
      # repository uses.
      #
      # That action runs a command perfectly well and **does not hand back what
      # it printed**: `steps.<id>.outputs.stdout` came through empty, so the
      # report never reached the triage step. Every other workflow here only
      # needs the remote command's *exit status*, which is why nothing had
      # noticed. This one needs its output, so it does the connection itself.
      #
      # Worth keeping as the reason not to "simplify" this back later.
      - name: Read what each container thinks of itself
        id: probe
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The host is a secret, so it cannot be pinned in a known_hosts file
          # committed here. Accepting the key on first use is what every other
          # workflow in this repository already does through the action; making
          # it explicit does not weaken anything, and the runner is fresh each
          # time so there is no key to have changed under us.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "cd ${DEPLOY_DIR} && chmod +x scripts/health-report.sh && ./scripts/health-report.sh" \
              > probe.out

          # A second question over the same connection: which commit is each
          # container running (#44). Separate from the health report because it
          # is a separate condition — a host can be entirely healthy and a build
          # behind, which is the silence #31 left open, and merging the two rows
          # into one report would mean one verdict for two unrelated faults.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "cd ${DEPLOY_DIR} && chmod +x scripts/deployed-revision.sh && ./scripts/deployed-revision.sh" \
              > revisions.out

          # Never leave a production key on the filesystem past the step that
          # needed it, even on a runner that is about to be destroyed.
          shred -u ~/.ssh/deploy_key

          echo "health rows: $(wc -l < probe.out)"
          echo "revision rows: $(wc -l < revisions.out)"

      - name: Triage the report
        id: triage
        run: |
          set -uo pipefail
          cp probe.out report.tsv

          if [ ! -s report.tsv ]; then
            # The probe produced nothing between the markers. That is not a
            # healthy stack — it is a broken watcher, and reporting it as "ok"
            # is precisely how this failure hides. Fail the run so it is visible
            # in the Actions tab rather than filing a reassuring issue comment.
            echo "::error::The health probe returned no rows. SSH reachable but the report is empty?"
            exit 1
          fi

          chmod +x scripts/health-triage.sh
          ./scripts/health-triage.sh < report.tsv > summary.md 2> verdict.env || true
          cat verdict.env >> "$GITHUB_OUTPUT"

          {
            echo 'summary<<KOLONIE_EOF'
            cat summary.md
            echo 'KOLONIE_EOF'
          } >> "$GITHUB_OUTPUT"

          cat summary.md

      - name: File, update or close the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.triage.outputs.VERDICT }}
          FINGERPRINT: ${{ steps.triage.outputs.FINGERPRINT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$ISSUE_TITLE\"" --json number,body --limit 1)"
          number="$(echo "$existing" | jq -r '.[0].number // empty')"

          if [ "$VERDICT" = "ok" ]; then
            # Nothing wrong. The only thing that may happen is closing a report
            # that is no longer true — and if there is none, this job says
            # nothing at all. A healthy stack producing a comment every fifteen
            # minutes is how an alert channel gets muted.
            if [ -n "$number" ]; then
              printf '%s\n\n%s\n' \
                'Recovered. Every container is running and none reports itself unhealthy.' \
                "$RUN_URL" > recovered.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file recovered.md
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --reason completed --comment "Closed automatically by Health Watch."
              echo "closed #$number"
            else
              echo "healthy, nothing open — saying nothing"
            fi
            exit 0
          fi

          # Written to a file rather than built as a shell string. A multi-line
          # literal inside a `run: |` block has to stay indented or it ends the
          # YAML scalar, and the failure is a parse error in a workflow nobody
          # can run — the fingerprint marker below is exactly the kind of line
          # that starts at column zero.
          {
            cat summary.md
            printf '\n<!-- health-watch-fingerprint: %s -->\n\n' "$FINGERPRINT"
            printf 'Filed automatically by [Health Watch](%s). It closes itself when the host\n' "$RUN_URL"
            printf 'reports every container healthy again — do not close it by hand while the\n'
            printf 'condition holds, or the next run will simply file it again.\n\n'
            printf 'Read this as a task with the cause open: a health check is as likely to be\n'
            printf 'wrong as the service is to be down. In #11 the service was entirely fine and\n'
            printf 'the check was looking at the wrong address family.\n'
          } > body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --label bug --label p1 --label area:infra \
              --body-file body.md
            echo "filed a new report"
            exit 0
          fi

          previous="$(echo "$existing" | jq -r '.[0].body // ""' \
            | sed -n 's/.*health-watch-fingerprint: \(.*\) -->.*/\1/p')"

          if [ "$previous" = "$FINGERPRINT" ]; then
            # Same containers broken the same way as last run. The open issue
            # already says so, and repeating it every fifteen minutes would bury
            # the change that matters under a hundred identical comments.
            echo "unchanged since the last run — #$number already says this"
            exit 0
          fi

          {
            printf 'What is wrong has changed.\n\n'
            cat summary.md
            printf '\n%s\n' "$RUN_URL"
          } > changed.md

          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file changed.md
          echo "updated #$number"

      # --- deploy drift (#44) ---------------------------------------------
      #
      # A separate condition, a separate issue and a separate verdict. #31 made
      # one commit produce one deploy, which was the mechanism; this is the
      # measurement, and it is what notices the ways a host falls behind that no
      # queue can prevent — a deploy that failed and rolled back, a cancelled
      # run, a manual intervention, an image that never built.
      #
      # It runs whatever the health verdict was. A host is perfectly capable of
      # being green and a build behind, and that combination is the one that
      # stays hidden longest.
      - name: Compare what is running against what was last built
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          chmod +x scripts/drift-triage.sh
          ./scripts/drift-triage.sh < revisions.out > drift.md 2> drift-verdict.env
          status=$?

          # Exit 2 is the script saying it could not run — an empty probe rather
          # than a behind host. Fail the run so it is visible in the Actions tab,
          # for the same reason the health triage does: a broken watcher that
          # reports "ok" is the failure this workflow exists to end.
          if [ "$status" -eq 2 ]; then
            echo "::error::The revision probe returned no rows. SSH reachable but the report is empty?"
            exit 1
          fi

          cat drift-verdict.env >> "$GITHUB_OUTPUT"
          cat drift.md

      - name: File, update or close the drift report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.drift.outputs.VERDICT }}
          FINGERPRINT: ${{ steps.drift.outputs.FINGERPRINT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$DRIFT_ISSUE_TITLE\"" --json number,body --limit 1)"
          number="$(echo "$existing" | jq -r '.[0].number // empty')"

          # `unknown` files nothing. It means this check is partly blind — an
          # image from before kolonie-platform#75, or a revision GHCR no longer
          # lists — and an issue that says "I cannot tell" every fifteen minutes
          # teaches the reader to ignore the ones that say something.
          if [ "$VERDICT" != "drifted" ]; then
            if [ -n "$number" ]; then
              printf '%s\n\n%s\n' \
                'Resolved. Every service is running the newest image built for it.' \
                "$RUN_URL" > drift-recovered.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file drift-recovered.md
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --reason completed --comment "Closed automatically by Health Watch."
              echo "closed #$number"
            else
              echo "verdict $VERDICT, nothing open — saying nothing"
            fi
            exit 0
          fi

          {
            cat drift.md
            printf '\n<!-- drift-watch-fingerprint: %s -->\n\n' "$FINGERPRINT"
            printf 'Filed automatically by [Health Watch](%s). It closes itself once every\n' "$RUN_URL"
            printf 'service is running the newest image built for it.\n\n'
            printf 'A green stack and a behind host are compatible states, so do not read this\n'
            printf 'as an outage. Read it as: a build exists that this host is not running, and\n'
            printf 'something decided that without saying so.\n'
          } > drift-body.md

          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$DRIFT_ISSUE_TITLE" \
              --label p1 --label area:infra \
              --body-file drift-body.md
            echo "filed a new drift report"
            exit 0
          fi

          previous="$(echo "$existing" | jq -r '.[0].body // ""' \
            | sed -n 's/.*drift-watch-fingerprint: \(.*\) -->.*/\1/p')"

          if [ "$previous" = "$FINGERPRINT" ]; then
            echo "unchanged since the last run — #$number already says this"
            exit 0
          fi

          {
            printf 'What is behind has changed.\n\n'
            cat drift.md
            printf '\n%s\n' "$RUN_URL"
          } > drift-changed.md

          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file drift-body.md
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file drift-changed.md
          echo "updated #$number"
