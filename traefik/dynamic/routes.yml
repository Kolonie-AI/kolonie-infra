# Traefik Dynamic Configuration — Routing
# Kolonie AI
# Routes are configured here instead of Docker labels (Docker provider has API version issues)
#
# verifier-runner deliberately has no route. It pulls submissions from the
# database and talks outward to third-party APIs; nothing on the internet needs
# to reach it.

http:
  routers:
    # /health, and only /health, readable from the landing page (#86).
    #
    # **First in the file because it is the most specific router here**, and the
    # only one that matches on a path. All five hostnames answer from the same
    # `api` service, so this is one router rather than five — and it has to come
    # ahead of the host routers below, which would otherwise take the request
    # and answer without the CORS header.
    #
    # **The priority is explicit rather than inherited.** Traefik defaults it to
    # the rule's length, which does put this ahead today, purely because
    # `&& Path(...)` makes the string longer. That is an accident of spelling:
    # rewording a rule below could overtake it, and nothing would fail loudly —
    # the landing page would simply go back to reading as an outage. A number
    # says what the file means.
    #
    # `security-headers` is still here. This router replaces the host routers
    # for one path, so anything it leaves out is a header that path stops
    # sending — which is how a fix for a missing header becomes five missing
    # ones. `rate-limit` is deliberately not: a health endpoint is what you hit
    # when you are worried, and the abuse case for a fixed 15-byte public body
    # is not request volume.
    health:
      rule: >-
        (Host(`api.kolonie.ai`) || Host(`academy.kolonie.ai`) || Host(`mcp.kolonie.ai`)
        || Host(`challenge.kolonie.ai`) || Host(`console.kolonie.ai`)) && Path(`/health`)
      priority: 1000
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - health-cors
      service: api
      tls:
        certResolver: cloudflare

    # Public API — also serves the academy endpoints
    api:
      rule: "Host(`api.kolonie.ai`) || Host(`academy.kolonie.ai`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - rate-limit
      service: api
      tls:
        certResolver: cloudflare

    # MCP — same container as the API, deliberately its own router.
    # Foreign agents write this hostname into their configuration and the Colony
    # stops controlling their upgrade cycle the moment the first skill ships —
    # the same argument ARCHITECTURE.md makes for versioning endpoints under
    # /v1/. A separate router means the MCP surface can be moved to its own
    # container, or put behind its own rate limits, without changing a URL any
    # agent has stored.
    mcp:
      rule: "Host(`mcp.kolonie.ai`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - rate-limit
      service: api
      tls:
        certResolver: cloudflare

    # Browser Capability Gate — the same container again, and a separate router
    # for the same reason MCP has one. What it serves is a page a browser loads,
    # not an endpoint an agent calls, so it will want its own rate limits and
    # possibly its own container once the hCaptcha form is real
    # (kolonie-platform#21). Both are changes to this block alone if the address
    # already belongs to a router of its own.
    #
    # The API process serves the files rather than an Nginx sidecar — the
    # reasoning is D-022 in kolonie-platform/docs/decisions.md, which closes the
    # option that #18 left open.
    challenge:
      rule: "Host(`challenge.kolonie.ai`)"
      entryPoints:
        - websecure
      # security-headers but no rate-limit (#59): the abuse case for a page a
      # browser loads is the CAPTCHA behind it, not request volume.
      middlewares:
        - security-headers
      service: api
      tls:
        certResolver: cloudflare

    # The quest console — the same api container again, and a fifth host rather
    # than a path prefix on api.kolonie.ai (#60, kolonie-platform#179).
    #
    # **A cookie is scoped to a host, and that is the whole reason for the extra
    # name.** Serving a session-bearing surface under api.kolonie.ai would put a
    # browser session cookie on the same origin as the machine API — ambient
    # authority on endpoints that were designed to be reached with an API key and
    # nothing else.
    #
    # rate-limit is attached from the first request, not once there is something
    # to protect: this is the surface where a sign-in form will live, and its
    # per-IP throttle is only honest because #56 made X-Forwarded-For carry the
    # client rather than a Cloudflare edge.
    #
    # It answers before the console exists, deliberately. A host that 404s is a
    # smaller problem than a feature nobody can test.
    console:
      rule: "Host(`console.kolonie.ai`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - rate-limit
      service: api
      tls:
        certResolver: cloudflare

    # Website (static)
    website:
      rule: "Host(`kolonie.ai`)"
      entryPoints:
        - websecure
      # No rate-limit (#59): static and cached at the edge.
      middlewares:
        - security-headers
      service: website
      tls:
        certResolver: cloudflare

    # pgAdmin — the maintainer's database client, not a citizen-facing surface
    # (#30). The one router here fronting a container that can read and write
    # every table, so it is also the only one carrying an auth middleware.
    #
    # Cloudflare-proxied like the rest, so the origin address stays hidden and
    # scripts/origin-firewall.sh's rule set still applies. Zero Trust is
    # deliberately not in scope — see #30's "What is NOT in scope".
    pgadmin:
      rule: "Host(`db.kolonie.ai`)"
      entryPoints:
        - websecure
      # **security-headers before pgadmin-auth, and this order was measured.**
      # #59 specified the reverse — authentication first, so nothing runs ahead
      # of it — and the deploy on 2026-08-02 showed what that costs: basicAuth
      # answers an unauthenticated request itself, short-circuiting the chain, so
      # the 401 never reached security-headers and carried no HSTS, no nosniff and
      # no frame-deny. That 401 is what nearly every visitor to db.kolonie.ai
      # receives. The other five hosts had their headers; this one did not.
      #
      # Putting security-headers first is safe in a way a general "auth first"
      # rule cannot see: it reads nothing from the request and grants nothing —
      # it decorates the response. The rule exists to keep middleware that can
      # *act* on an unauthenticated request from doing so, and this one cannot.
      #
      # The three headers db.kolonie.ai already sent came from pgAdmin itself;
      # served from here they survive replacing that container.
      middlewares:
        - security-headers
        - pgadmin-auth
      service: pgadmin
      tls:
        certResolver: cloudflare

    # Loki — the log store's read API, and the only reason it is on the public
    # edge at all (#68).
    #
    # **The consumer runs off this host on purpose.** kolonie-docs#133's Watch
    # Agent lives in GitHub Actions, because a monitor that dies with the thing
    # it monitors is the failure the whole logging programme exists to catch. So
    # the query API has to be reachable from outside the box, and that means a
    # router here rather than a port on the internal network.
    #
    # **Second only to pgadmin in what it exposes, and it carries the same kind
    # of lock.** Every line every service has written is readable through this
    # host: startup exceptions, request paths, whatever a process printed on a
    # bad day. It is a read of the Colony's whole interior, so it is behind
    # loki-auth below and it is refused without it.
    #
    # security-headers first, then the auth — the order pgadmin's comment argues
    # at length, and for the same reason: basicAuth answers an unauthenticated
    # request itself and ends the chain, so an auth-first order would send the
    # 401 that nearly every visitor here receives with no HSTS and no nosniff.
    #
    # rate-limit is attached as well, and this is the one router where it guards
    # something other than abuse: a LogQL query over thirty days is expensive to
    # answer, so a loop with a stolen token could exhaust the host rather than
    # merely read it.
    loki:
      rule: "Host(`logs.kolonie.ai`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - rate-limit
        - loki-auth
      service: loki
      tls:
        certResolver: cloudflare

    # www → apex, so the canonical URL is unambiguous
    website-www:
      rule: "Host(`www.kolonie.ai`)"
      entryPoints:
        - websecure
      # security-headers before the redirect, for the reason the pgadmin router
      # above spells out at length: a middleware that answers the request itself
      # ends the chain, and nothing after it runs. `redirect-to-apex` answers
      # every request here with a 301, so ordered second it would send a bare
      # redirect carrying no HSTS — which is what this host did until #64.
      #
      # The protection gained is small: a browser follows the 301 and the apex
      # sets HSTS a moment later. It is one line, and it makes the answer "every
      # host we serve sends them" instead of "five of six, and here is why the
      # sixth is fine" — the second sentence being the kind nobody re-derives
      # correctly a year on.
      middlewares:
        - security-headers
        - redirect-to-apex
      service: website
      tls:
        certResolver: cloudflare

  middlewares:
    # The first of pgAdmin's two locks (#30).
    #
    # **`usersFile`, never `users`.** Traefik performs no environment
    # interpolation in the files under /dynamic — a `users:` list here would mean
    # an htpasswd hash committed to a public repository, and `${VAR}` would be
    # matched against literally. The file is written by hand on the host into
    # /opt/kolonie/secrets/, which is .gitignore'd and mounted read-only into the
    # Traefik container by docker-compose.yml:
    #
    #   htpasswd -nbB <user> <password> >> /opt/kolonie/secrets/pgadmin.htpasswd
    #   chmod 600 /opt/kolonie/secrets/pgadmin.htpasswd
    #
    # Missing, this middleware is invalid and Traefik drops the pgadmin router
    # alone — db.kolonie.ai stops answering and nothing else changes. That is the
    # right failure for a lock: absent means shut, not open.
    pgadmin-auth:
      basicAuth:
        usersFile: "/secrets/pgadmin.htpasswd"
        realm: "Kolonie"
        # The header is consumed here and not passed to pgAdmin, which runs its
        # own login and would otherwise see an Authorization header it cannot
        # interpret.
        removeHeader: true

    # The lock on the log store (#68).
    #
    # **`usersFile` for the reason pgadmin-auth spells out above** — Traefik
    # interpolates nothing under /dynamic, so a credential here would be a hash
    # in a public repository. The file is written by hand on the host into
    # /opt/kolonie/secrets/, which is .gitignore'd and mounted read-only into
    # Traefik by docker-compose.yml:
    #
    #   htpasswd -nbB watch <token> >> /opt/kolonie/secrets/loki.htpasswd
    #   chmod 600 /opt/kolonie/secrets/loki.htpasswd
    #
    # **A credential of its own, never one that already exists.** It grants a
    # read across every service's logs, so anything else it were attached to
    # would silently inherit that reach. The consumer is kolonie-docs#133, which
    # holds it as a repository secret and sends it as ordinary basic auth.
    #
    # Missing, this middleware is invalid and Traefik drops the loki router
    # alone: logs.kolonie.ai stops answering and every other host keeps serving.
    # Absent means shut, which is the right failure for a lock.
    #
    # `removeHeader` because Loki has `auth_enabled: false` and would otherwise
    # be handed an Authorization header it has no use for.
    loki-auth:
      basicAuth:
        usersFile: "/secrets/loki.htpasswd"
        realm: "Kolonie"
        removeHeader: true

    redirect-to-apex:
      redirectRegex:
        regex: "^https://www\\.kolonie\\.ai/(.*)"
        replacement: "https://kolonie.ai/${1}"
        permanent: true

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://kolonie-api:3000"

    website:
      loadBalancer:
        servers:
          - url: "http://kolonie-website:80"

    pgadmin:
      loadBalancer:
        servers:
          - url: "http://kolonie-pgadmin:80"

    loki:
      loadBalancer:
        servers:
          - url: "http://kolonie-loki:3100"
