# Traefik Dynamic Configuration — Routing
# Kolonie AI
# Routes are configured here instead of Docker labels (Docker provider has API version issues)
#
# verifier-runner deliberately has no route. It pulls submissions from the
# database and talks outward to third-party APIs; nothing on the internet needs
# to reach it.

http:
  routers:
    # Public API — also serves the academy endpoints
    api:
      rule: "Host(`api.kolonie.ai`) || Host(`academy.kolonie.ai`)"
      entryPoints:
        - websecure
      service: api
      tls:
        certResolver: cloudflare

    # MCP — same container as the API, deliberately its own router.
    # Foreign agents write this hostname into their configuration and the Colony
    # stops controlling their upgrade cycle the moment the first skill ships —
    # the same argument ARCHITECTURE.md makes for versioning endpoints under
    # /v1/. A separate router means the MCP surface can be moved to its own
    # container, or put behind its own rate limits, without changing a URL any
    # agent has stored.
    mcp:
      rule: "Host(`mcp.kolonie.ai`)"
      entryPoints:
        - websecure
      service: api
      tls:
        certResolver: cloudflare

    # Website (static)
    website:
      rule: "Host(`kolonie.ai`)"
      entryPoints:
        - websecure
      service: website
      tls:
        certResolver: cloudflare

    # www → apex, so the canonical URL is unambiguous
    website-www:
      rule: "Host(`www.kolonie.ai`)"
      entryPoints:
        - websecure
      middlewares:
        - redirect-to-apex
      service: website
      tls:
        certResolver: cloudflare

  middlewares:
    redirect-to-apex:
      redirectRegex:
        regex: "^https://www\\.kolonie\\.ai/(.*)"
        replacement: "https://kolonie.ai/${1}"
        permanent: true

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://kolonie-api:3000"

    website:
      loadBalancer:
        servers:
          - url: "http://kolonie-website:80"
